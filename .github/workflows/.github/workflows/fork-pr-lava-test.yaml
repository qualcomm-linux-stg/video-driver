name: Fork PR Build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prepare-metadata:
    name: Prepare build metadata
    runs-on: ubuntu-latest

    outputs:
      docker_image: ${{ steps.metadata.outputs.docker_image }}
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}

    steps:
      - name: Generate build metadata
        id: metadata
        shell: bash
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          BUILD_MATRIX: ${{ vars.BUILD_MATRIX }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DOCKER_IMAGE:-}" ]; then
            echo "::error::Repository variable DOCKER_IMAGE is not defined"
            exit 1
          fi

          if [ -z "${BUILD_MATRIX:-}" ]; then
            echo "::error::Repository variable BUILD_MATRIX is not defined"
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            COMMIT_SHA="$PR_HEAD_SHA"
          else
            COMMIT_SHA="$GITHUB_SHA_VALUE"
          fi

          if [ -z "${COMMIT_SHA:-}" ]; then
            echo "::error::Unable to determine commit SHA"
            exit 1
          fi

          echo "=== Workflow inputs ==="
          echo "Event       : $EVENT_NAME"
          echo "Docker image: $DOCKER_IMAGE"
          echo "Commit SHA  : $COMMIT_SHA"
          echo "Build matrix:"
          echo "$BUILD_MATRIX"

          echo "$BUILD_MATRIX" | jq empty

          echo "docker_image=$DOCKER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "build_matrix<<BUILD_MATRIX_EOF"
            echo "$BUILD_MATRIX"
            echo "BUILD_MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/metadata"

          jq -n \
            --arg docker_image "$DOCKER_IMAGE" \
            --argjson build_matrix "$BUILD_MATRIX" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg event_name "$EVENT_NAME" \
            --arg repository "${{ github.repository }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg workflow_run_attempt "${{ github.run_attempt }}" \
            --arg pr_number "${{ github.event.pull_request.number || '' }}" \
            --arg pr_head_repository "${{ github.event.pull_request.head.repo.full_name || github.repository }}" \
            '{
              docker_image: $docker_image,
              build_matrix: $build_matrix,
              commit_sha: $commit_sha,
              event_name: $event_name,
              repository: $repository,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              pr_number: $pr_number,
              pr_head_repository: $pr_head_repository
            }' > "$GITHUB_WORKSPACE/metadata/build-metadata.json"

          echo "=== Generated metadata ==="
          jq . "$GITHUB_WORKSPACE/metadata/build-metadata.json"

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: ${{ github.workspace }}/metadata/build-metadata.json
          retention-days: 7

  build:
    name: Build
    needs:
      - prepare-metadata

    uses: ./.github/workflows/_build.yaml

    with:
      docker_image: ${{ needs.prepare-metadata.outputs.docker_image }}
      build_matrix: ${{ needs.prepare-metadata.outputs.build_matrix }}
      commit_sha: ${{ needs.prepare-metadata.outputs.commit_sha }}

    # Do not use "secrets: inherit" here.
    #
    # Fork pull requests must not receive LAVA credentials or other
    # protected repository secrets.