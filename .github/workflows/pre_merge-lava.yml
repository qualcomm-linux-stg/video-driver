name: pre_merge_lava

run-name: LAVA Test - ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows:
      - pre_merge
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  verify-build:
    name: Verify completed build
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      docker_image: ${{ steps.metadata.outputs.docker_image }}
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      build_run_id: ${{ steps.metadata.outputs.build_run_id }}
      build_repository: ${{ steps.metadata.outputs.build_repository }}

    steps:
      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
          name: build-metadata
          path: metadata

      - name: Read and validate build metadata
        id: metadata
        shell: bash
        env:
          METADATA_FILE: metadata/build-metadata.json

          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}

        run: |
          set -euo pipefail

          if [ ! -f "$METADATA_FILE" ]; then
            echo "::error::Build metadata was not found"
            find metadata -maxdepth 3 -type f -print || true
            exit 1
          fi

          jq empty "$METADATA_FILE"

          echo "=== Build metadata ==="
          jq . "$METADATA_FILE"

          METADATA_RUN_ID="$(jq -r '.build_run_id // empty' "$METADATA_FILE")"
          METADATA_REPOSITORY="$(jq -r '.repository // empty' "$METADATA_FILE")"
          METADATA_SOURCE_REPOSITORY="$(jq -r '.source_repository // empty' "$METADATA_FILE")"
          DOCKER_IMAGE="$(jq -r '.docker_image // empty' "$METADATA_FILE")"
          COMMIT_SHA="$(jq -r '.commit_sha // empty' "$METADATA_FILE")"
          BUILD_MATRIX="$(jq -c '.build_matrix' "$METADATA_FILE")"

          if [ "$METADATA_RUN_ID" != "$EXPECTED_RUN_ID" ]; then
            echo "::error::Metadata run ID does not match workflow_run ID"
            echo "Metadata run ID: $METADATA_RUN_ID"
            echo "Expected run ID: $EXPECTED_RUN_ID"
            exit 1
          fi

          if [ "$METADATA_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::Metadata repository does not match workflow repository"
            echo "Metadata repository: $METADATA_REPOSITORY"
            echo "Expected repository: $EXPECTED_REPOSITORY"
            exit 1
          fi

          if [ "$COMMIT_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Metadata commit does not match workflow_run head SHA"
            echo "Metadata commit: $COMMIT_SHA"
            echo "Expected commit: $EXPECTED_HEAD_SHA"
            exit 1
          fi

          if [ -z "$METADATA_SOURCE_REPOSITORY" ] ||
             [ "$METADATA_SOURCE_REPOSITORY" = "null" ]; then
            echo "::error::source_repository is missing from metadata"
            exit 1
          fi

          if [ "$METADATA_SOURCE_REPOSITORY" != "$EXPECTED_HEAD_REPOSITORY" ]; then
            echo "::error::Metadata source repository does not match PR source repository"
            echo "Metadata source repository: $METADATA_SOURCE_REPOSITORY"
            echo "Expected source repository: $EXPECTED_HEAD_REPOSITORY"
            exit 1
          fi

          if [ -z "$DOCKER_IMAGE" ] || [ "$DOCKER_IMAGE" = "null" ]; then
            echo "::error::docker_image is missing from metadata"
            exit 1
          fi

          if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" = "null" ]; then
            echo "::error::commit_sha is missing from metadata"
            exit 1
          fi

          if [ "$BUILD_MATRIX" = "null" ] ||
             [ -z "$BUILD_MATRIX" ]; then
            echo "::error::build_matrix is missing from metadata"
            exit 1
          fi

          echo "$BUILD_MATRIX" | jq empty

          {
            echo "docker_image=$DOCKER_IMAGE"
            echo "commit_sha=$COMMIT_SHA"
            echo "build_run_id=$METADATA_RUN_ID"

            # Artifacts were uploaded by the base repository workflow.
            # Do not use the fork repository here.
            echo "build_repository=$METADATA_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "build_matrix<<BUILD_MATRIX_EOF"
            echo "$BUILD_MATRIX"
            echo "BUILD_MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record fork provenance
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.metadata.outputs.build_repository }}
          COMMIT_SHA: ${{ steps.metadata.outputs.commit_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail

          {
            echo "## Fork PR LAVA Provenance"
            echo ""
            echo "- PR source repository: \`$HEAD_REPOSITORY\`"
            echo "- Tested commit: \`$COMMIT_SHA\`"
            echo "- Artifact repository: \`$SOURCE_REPOSITORY\`"
            echo "- Build workflow run: \`$WORKFLOW_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  lava-test:
    name: Run LAVA tests
    needs:
      - verify-build
    if: ${{ needs.verify-build.result == 'success' }}

    uses: ./.github/workflows/test.yml

    with:
      docker_image: ${{ needs.verify-build.outputs.docker_image }}
      build_matrix: ${{ needs.verify-build.outputs.build_matrix }}
      commit_sha: ${{ needs.verify-build.outputs.commit_sha }}
      build_run_id: ${{ needs.verify-build.outputs.build_run_id }}
      build_repository: ${{ needs.verify-build.outputs.build_repository }}

    secrets:
      LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
      LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}