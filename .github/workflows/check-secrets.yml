name: hydra-secret-check
on:
  push:
    branches:
      - test-njetha-patch
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    environment: HYDRA_WIFI_PASSWORD
    env:
      HYDRA_WIFI_PASSWORD: ${{ secrets.HYDRA_WIFI_PASSWORD }}
    steps:
      - name: Check HYDRA_WIFI_PASSWORD is visible
        run: |
          if [ -z "${HYDRA_WIFI_PASSWORD:-}" ]; then
            echo "::error::HYDRA_WIFI_PASSWORD is empty or not available"
            exit 1
          fi
          echo "HYDRA_WIFI_PASSWORD is available (length=${#HYDRA_WIFI_PASSWORD})"
