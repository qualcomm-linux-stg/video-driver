name: sync-and-build

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      build_matrix:
        description: Build matrix for multi-target builds
        type: string
        required: true

      commit_sha:
        description: Exact commit SHA to build
        type: string
        required: true

      source_repository:
        description: Repository containing the commit to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 720

    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels:
        - self-hosted
        - video-stg-u2204-x64-large-od-ephem

    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pre-clean workspace
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "=== Disk before clean ==="
          df -h

          rm -rf "$WORKSPACE/build/tmp" || true
          rm -rf "$WORKSPACE/build" || true
          rm -rf "$WORKSPACE/downloads" || true
          rm -rf "$WORKSPACE/artifacts" || true
          rm -rf "$WORKSPACE/archive-validation" || true
          rm -rf "$WORKSPACE/v4l-video-test-app/build" || true
          rm -rf "$WORKSPACE/qcomflash-staging" || true
          rm -f "$WORKSPACE/"*_build.tar || true
          rm -f "$WORKSPACE/"*_build.tar.gz || true
          rm -f "$WORKSPACE/"*_archive_manifest.txt || true
          rm -f "$(dirname "$WORKSPACE")/kas_local_conf_header.txt" || true

          echo "=== Disk after clean up==="
          df -h

          echo "=== Memory =========================="
          free -h

      - name: Validate build inputs
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          set -euo pipefail

          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA: $COMMIT_SHA"
            exit 1
          fi

          if ! [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid source repository: $SOURCE_REPOSITORY"
            exit 1
          fi

          echo "Source repository: $SOURCE_REPOSITORY"
          echo "Commit SHA:       $COMMIT_SHA"

      - name: Validate matrix entry
        shell: bash
        env:
          MACHINE: ${{ matrix.build_matrix.machine }}
          IMAGE_NAME: ${{ matrix.build_matrix.image_name }}
          PREBUILT_ARTIFACT: ${{ matrix.build_matrix.prebuilt_artifact }}
        run: |
          set -euo pipefail

          if [ -z "$MACHINE" ]; then
            echo "::error::matrix.build_matrix.machine is empty"
            exit 1
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "::error::matrix.build_matrix.image_name is empty"
            exit 1
          fi

          if [ -z "$PREBUILT_ARTIFACT" ]; then
            echo "::error::matrix.build_matrix.prebuilt_artifact is empty for machine: $MACHINE"
            exit 1
          fi

          if [[ "$MACHINE" =~ [[:space:]\;\&\|\<\>\`\'\"] ]]; then
            echo "::error::Invalid machine value: $MACHINE"
            exit 1
          fi

          if [[ "$IMAGE_NAME" =~ [[:space:]\;\&\|\<\>\`\'\"] ]]; then
            echo "::error::Invalid image_name value: $IMAGE_NAME"
            exit 1
          fi

          if [[ "$PREBUILT_ARTIFACT" =~ [[:space:]\;\&\|\<\>\`\'\"] ]]; then
            echo "::error::Invalid prebuilt_artifact value: $PREBUILT_ARTIFACT"
            exit 1
          fi

          case "$PREBUILT_ARTIFACT" in
            *.rootfs.qcomflash.tar.gz)
              ;;
            *)
              echo "::error::prebuilt_artifact must end with .rootfs.qcomflash.tar.gz"
              echo "::error::Current value: $PREBUILT_ARTIFACT"
              exit 1
              ;;
          esac

          echo "Machine           : $MACHINE"
          echo "Image name        : $IMAGE_NAME"
          echo "Prebuilt artifact : $PREBUILT_ARTIFACT"

      - name: Checkout exact HEAD commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify commit before build
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ inputs.source_repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          echo "==========================================="
          echo "Event      : $EVENT_NAME"
          echo "Repository : $EXPECTED_REPOSITORY"
          echo "Input SHA  : $EXPECTED_SHA"
          echo "HEAD SHA   : $actual_sha"
          echo "Branch     : $REF_NAME"
          echo "Commit msg : $(git log -1 --pretty=format:'%s')"
          echo "Author     : $(git log -1 --pretty=format:'%an <%ae>')"
          echo "Date       : $(git log -1 --pretty=format:'%ci')"
          echo "========================================"

          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual  : $actual_sha"
            exit 1
          fi

          echo "Correct repository and commit checked out"

      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Retag Docker image
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          docker tag \
            "artifacts.codelinaro.org/clo-420-qli-registry/$DOCKER_IMAGE" \
            "$DOCKER_IMAGE" || true

          docker images | grep -- "$DOCKER_IMAGE" || true

      - name: Download prebuilt qcomflash artifact from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
          IMAGE_NAME: ${{ matrix.build_matrix.image_name }}
          PREBUILT_ARTIFACT: ${{ matrix.build_matrix.prebuilt_artifact }}
        run: |
          set -euo pipefail

          S3_PREFIX="s3://qli-stg-video-gh-artifacts/qualcomm-linux-stg/video-driver/nightlybuild"

          deploy_dir="$WORKSPACE/build/tmp/deploy/images/$MACHINE"
          extract_dir="$deploy_dir/prebuilt-qcomflash"
          qcomflash_dir="$deploy_dir/${IMAGE_NAME}-${MACHINE}.rootfs.qcomflash"
          archive_path="$WORKSPACE/$PREBUILT_ARTIFACT"

          echo "Machine           : $MACHINE"
          echo "Image name        : $IMAGE_NAME"
          echo "Prebuilt artifact : $PREBUILT_ARTIFACT"
          echo "S3 source         : $S3_PREFIX/$PREBUILT_ARTIFACT"
          echo "Deploy dir        : $deploy_dir"
          echo "Qcomflash dir     : $qcomflash_dir"

          rm -rf "$deploy_dir"
          rm -f "$archive_path"
          mkdir -p "$extract_dir"

          echo "=== Disk before download ==="
          df -h "$WORKSPACE" || true

          aws s3 cp \
            "$S3_PREFIX/$PREBUILT_ARTIFACT" \
            "$archive_path"

          if [ ! -s "$archive_path" ]; then
            echo "::error::Artifact download failed or file is empty: $archive_path"
            exit 1
          fi

          echo "=== Downloaded artifact ==="
          ls -lh "$archive_path"

          echo "=== Validating gzip artifact ==="
          gzip -t "$archive_path"

          echo "=== Validating tar contents ==="
          tar -tzf "$archive_path" >/dev/null

          echo "=== Extracting artifact ==="
          tar -xzf "$archive_path" -C "$extract_dir"

          echo "=== Extracted artifact structure ==="
          find "$extract_dir" -maxdepth 4 -print | sort || true

          rootfs_img="$(find "$extract_dir" -type f -name rootfs.img -print -quit)"

          if [ -z "$rootfs_img" ]; then
            echo "::error::rootfs.img not found in extracted artifact: $PREBUILT_ARTIFACT"
            find "$extract_dir" -maxdepth 5 -print | sort || true
            exit 1
          fi

          resolved_dir="$(dirname "$rootfs_img")"

          echo "Resolved qcomflash source dir: $resolved_dir"

          if [ ! -d "$resolved_dir" ]; then
            echo "::error::Resolved qcomflash source directory not found: $resolved_dir"
            exit 1
          fi

          rm -rf "$qcomflash_dir"
          mkdir -p "$qcomflash_dir"

          shopt -s dotglob nullglob
          mv "$resolved_dir"/* "$qcomflash_dir"/
          shopt -u dotglob nullglob

          rm -rf "$extract_dir"
          rm -f "$archive_path"

          if [ ! -d "$qcomflash_dir" ]; then
            echo "::error::Final qcomflash directory not found: $qcomflash_dir"
            exit 1
          fi

          if [ ! -f "$qcomflash_dir/rootfs.img" ]; then
            echo "::error::rootfs.img missing after qcomflash setup: $qcomflash_dir/rootfs.img"
            exit 1
          fi

          echo "=== Final deploy image directory ==="
          find "$deploy_dir" -maxdepth 2 -print | sort || true

          echo "=== Final qcomflash contents ==="
          ls -larth "$qcomflash_dir"

      - name: Download iris_test_app from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/v4l-video-test-app/build"

          aws s3 sync \
            "s3://qli-stg-video-gh-artifacts/qualcomm-linux-stg/video-driver/iris_test_app/" \
            "$WORKSPACE/v4l-video-test-app/build/"

          echo "iris_test_app download complete"
          ls -la "$WORKSPACE/v4l-video-test-app/build/"

      - name: Download video contents
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/downloads"

          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"

          wget -q \
            "https://github.com/Manigurr/qcom-linux-testkit/releases/download/iris_video_files/input_folder.tar.gz" \
            -O "$WORKSPACE/downloads/input_folder.tar.gz"

          for file in \
            "$WORKSPACE/downloads/video_clips_iris.tar.gz" \
            "$WORKSPACE/downloads/input_folder.tar.gz"
          do
            if [ ! -s "$file" ]; then
              echo "::error::Download failed or file is empty: $file"
              exit 1
            fi

            echo "Validating downloaded archive: $file"
            gzip -t "$file"
            tar -tzf "$file" >/dev/null
          done

          echo "Video contents download complete"
          ls -lh "$WORKSPACE/downloads"

      - name: Inject Iris test app to rootfs
        uses: qualcomm-linux-stg/video-driver/.github/actions/inject@kodiak_testing
        with:
          docker_image: ${{ inputs.docker_image }}
          machine: ${{ matrix.build_matrix.machine }}

      - name: Prepare qcomflash archive
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
          IMAGE_NAME: ${{ matrix.build_matrix.image_name }}
        run: |
          set -euo pipefail

          echo "Machine:    $MACHINE"
          echo "Image name: $IMAGE_NAME"

          deploy_dir="$WORKSPACE/build/tmp/deploy/images/$MACHINE"
          qcomflash_path="$deploy_dir/${IMAGE_NAME}-${MACHINE}.rootfs.qcomflash"

          if [ ! -e "$qcomflash_path" ]; then
            echo "::error::qcomflash path not found: $qcomflash_path"
            find "$deploy_dir" -maxdepth 3 -print | sort || true
            exit 1
          fi

          resolved_dir="$(readlink -f "$qcomflash_path")"

          if [ ! -d "$resolved_dir" ]; then
            echo "::error::Resolved qcomflash directory not found: $resolved_dir"
            exit 1
          fi

          if [ ! -f "$resolved_dir/rootfs.img" ]; then
            echo "::error::rootfs.img not found in: $resolved_dir"
            find "$resolved_dir" -maxdepth 2 -print | sort || true
            exit 1
          fi

          echo "=== [DIAG] Disk usage BEFORE cleanup ==="
          df -h

          echo "=== [DIAG] Top disk consumers in WORKSPACE ==="
          du -sh "$WORKSPACE"/*/ 2>/dev/null | sort -rh | head -20 || true

          echo "=== [DIAG] rootfs.img size ==="
          ls -lh "$resolved_dir/rootfs.img"
          du -sh "$resolved_dir/rootfs.img"

          echo "=== [DIAG] Full qcomflash directory size ==="
          du -sh "$resolved_dir"

          staging_dir="$WORKSPACE/qcomflash-staging"

          echo "=== Moving qcomflash directory out of build/tmp ==="
          rm -rf "$staging_dir"
          mv "$resolved_dir" "$staging_dir"

          echo "=== Confirming staging directory ==="
          ls -lh "$staging_dir/rootfs.img"
          du -sh "$staging_dir"

          echo "=== Freeing disk before packaging ==="

          echo "Removing build/tmp ..."
          rm -rf "$WORKSPACE/build/tmp" || true

          echo "Removing downloads ..."
          rm -rf "$WORKSPACE/downloads" || true

          echo "Removing iris_test_app build ..."
          rm -rf "$WORKSPACE/v4l-video-test-app/build" || true

          echo "=== [DIAG] Disk usage AFTER cleanup ==="
          df -h

          echo "=== [DIAG] Available space on WORKSPACE partition ==="
          df -h "$WORKSPACE" | awk 'NR==2 {
            print "Total : " $2
            print "Used  : " $3
            print "Free  : " $4
            print "Use%  : " $5
          }'

          echo "=== qcomflash contents before packaging ==="
          ls -larth "$staging_dir"

      - name: Prepare compressed build archive
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
          IMAGE_NAME: ${{ matrix.build_matrix.image_name }}
        run: |
          set -euo pipefail

          staging_dir="$WORKSPACE/qcomflash-staging"
          archive_path="$WORKSPACE/${MACHINE}_build.tar.gz"
          manifest_path="$WORKSPACE/${MACHINE}_archive_manifest.txt"
          validation_dir="$WORKSPACE/archive-validation"

          echo "Machine:    $MACHINE"
          echo "Image name: $IMAGE_NAME"
          echo "Staging:    $staging_dir"
          echo "Archive:    $archive_path"

          if [ ! -d "$staging_dir" ]; then
            echo "::error::qcomflash staging directory not found: $staging_dir"
            exit 1
          fi

          if [ ! -f "$staging_dir/rootfs.img" ]; then
            echo "::error::rootfs.img not found: $staging_dir/rootfs.img"
            find "$staging_dir" -maxdepth 2 -printf '%y %p -> %l\n' | sort || true
            exit 1
          fi

          echo
          echo "=== qcomflash contents ==="
          find "$staging_dir" \
            -maxdepth 2 \
            -printf '%y %p -> %l\n' | sort

          echo
          echo "=== qcomflash size ==="
          du -sh "$staging_dir"
          du -sh "$staging_dir/rootfs.img"

          echo
          echo "=== Complete filesystem usage before archive ==="
          df -hT

          echo
          echo "=== Inode usage before archive ==="
          df -ih

          echo
          echo "=== Archive filesystem usage ==="
          df -hT "$WORKSPACE"

          echo
          echo "=== Workspace usage before archive ==="
          du -sh "$WORKSPACE" 2>/dev/null || true

          source_size_bytes="$(du -sb "$staging_dir" | awk '{print $1}')"
          available_bytes="$(df -B1 --output=avail "$WORKSPACE" | tail -1 | tr -d '[:space:]')"

          # The source qcomflash directory remains on disk while the archive
          # is created. Reserve one GiB as a safety margin.
          safety_margin_bytes=$((1024 * 1024 * 1024))
          required_bytes=$((source_size_bytes + safety_margin_bytes))

          source_size_gib="$(awk "BEGIN {printf \"%.2f\", $source_size_bytes / 1024 / 1024 / 1024}")"
          available_gib="$(awk "BEGIN {printf \"%.2f\", $available_bytes / 1024 / 1024 / 1024}")"
          required_gib="$(awk "BEGIN {printf \"%.2f\", $required_bytes / 1024 / 1024 / 1024}")"

          echo
          echo "=== Archive disk-space calculation ==="
          echo "Source qcomflash size : ${source_size_gib} GiB"
          echo "Safety margin         : 1.00 GiB"
          echo "Required free space   : ${required_gib} GiB"
          echo "Available free space  : ${available_gib} GiB"

          if [ "$available_bytes" -lt "$required_bytes" ]; then
            echo "::error::Insufficient disk space for archive creation"
            echo "::error::Required free space: ${required_gib} GiB"
            echo "::error::Available free space: ${available_gib} GiB"
            echo "::error::Filesystem containing workspace: $WORKSPACE"

            echo
            echo "=== Detailed filesystem usage ==="
            df -hT

            echo
            echo "=== Largest workspace entries ==="
            du -x -h -d 2 "$WORKSPACE" 2>/dev/null \
              | sort -h \
              | tail -50 || true

            exit 1
          fi

          echo "Sufficient disk space is available for archive creation"

          rm -f "$archive_path" "$manifest_path"
          rm -rf "$validation_dir"

          echo
          echo "=== Creating compressed build archive ==="

          archive_status=0

          if command -v pigz >/dev/null 2>&1; then
            pigz_threads="$(nproc)"

            if [ "$pigz_threads" -gt 8 ]; then
              pigz_threads=8
            fi

            echo "Using pigz with $pigz_threads threads"

            tar -I "pigz -p $pigz_threads -1" \
              -cf "$archive_path" \
              -C "$staging_dir" \
              . || archive_status=$?
          else
            echo "pigz is not available; using gzip"

            tar -czf "$archive_path" \
              -C "$staging_dir" \
              . || archive_status=$?
          fi

          if [ "$archive_status" -ne 0 ]; then
            echo "::error::Archive creation failed with exit code: $archive_status"

            echo
            echo "=== Filesystem usage after archive failure ==="
            df -hT

            echo
            echo "=== Inode usage after archive failure ==="
            df -ih

            echo
            echo "=== Partial archive details ==="
            if [ -e "$archive_path" ]; then
              ls -lh "$archive_path"
              du -h "$archive_path" || true
            else
              echo "Archive file was not created"
            fi

            exit "$archive_status"
          fi

          if [ ! -s "$archive_path" ]; then
            echo "::error::Build archive was not created or is empty: $archive_path"
            exit 1
          fi

          echo
          echo "=== Archive details ==="
          ls -lh "$archive_path"
          du -h "$archive_path"

          echo
          echo "=== Filesystem usage after archive creation ==="
          df -hT "$WORKSPACE"

          echo
          echo "=== Validating gzip stream ==="
          if ! gzip -t "$archive_path"; then
            echo "::error::Compressed archive is corrupt: $archive_path"
            exit 1
          fi

          echo "Gzip stream is valid"

          echo
          echo "=== Generating archive manifest ==="
          if ! tar -tzf "$archive_path" > "$manifest_path"; then
            echo "::error::Unable to read archive contents: $archive_path"
            exit 1
          fi

          echo
          echo "=== Verifying compressed archive contents ==="
          sed -n '1,200p' "$manifest_path"

          if ! grep -Fxq './rootfs.img' "$manifest_path"; then
            echo "::error::rootfs.img is missing from $archive_path"
            echo "Matching rootfs entries:"
            grep -i 'rootfs' "$manifest_path" || true
            exit 1
          fi

          echo "rootfs.img confirmed inside compressed archive"

          # contents.xml is optional because it is not generated for every
          # machine. If it exists, verify that it is present in the archive.
          if [ -f "$staging_dir/contents.xml" ]; then
            if grep -Fxq './contents.xml' "$manifest_path"; then
              echo "contents.xml confirmed inside compressed archive"
            else
              echo "::error::contents.xml exists in the source qcomflash directory but is missing from the archive"
              exit 1
            fi
          else
            echo "contents.xml is not present for machine: $MACHINE"
            echo "Continuing because contents.xml is optional for this image layout"
          fi

          echo
          echo "=== Verifying rootfs.img extraction ==="
          mkdir -p "$validation_dir"

          if ! tar -xzf "$archive_path" \
            -C "$validation_dir" \
            ./rootfs.img; then
            echo "::error::Unable to extract rootfs.img from archive"
            rm -rf "$validation_dir"
            exit 1
          fi

          extracted_rootfs="$validation_dir/rootfs.img"

          if [ ! -s "$extracted_rootfs" ]; then
            echo "::error::Extracted rootfs.img is missing or empty"
            rm -rf "$validation_dir"
            exit 1
          fi

          source_rootfs_size="$(stat -c '%s' "$staging_dir/rootfs.img")"
          extracted_rootfs_size="$(stat -c '%s' "$extracted_rootfs")"

          echo "Original rootfs.img size : $source_rootfs_size bytes"
          echo "Extracted rootfs.img size: $extracted_rootfs_size bytes"

          if [ "$source_rootfs_size" -ne "$extracted_rootfs_size" ]; then
            echo "::error::Extracted rootfs.img size does not match the original"
            rm -rf "$validation_dir"
            exit 1
          fi

          rm -rf "$validation_dir"

          echo "rootfs.img extraction and size validation passed"

          echo
          echo "=== Final archive details ==="
          ls -lh "$archive_path"
          du -h "$archive_path"

          echo
          echo "=== Final filesystem usage ==="
          df -hT "$WORKSPACE"

          mkdir -p "$WORKSPACE/artifacts"
          printf '%s\n' "$archive_path" > "$WORKSPACE/artifacts/file_list.txt"

          echo
          echo "=== Single S3 upload file list ==="
          cat "$WORKSPACE/artifacts/file_list.txt"

      - name: Upload artifacts to S3
        uses: qualcomm-linux-stg/video-driver/.github/actions/aws_s3_helper@kodiak_testing
        with:
          s3_bucket: qli-stg-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.build_matrix.machine }}

      - name: Upload machine-specific pre-signed URLs
        uses: actions/upload-artifact@v4
        with:
          name: presigned-urls-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}/presigned_urls.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload compressed build archive
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.build_matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.build_matrix.machine }}_build.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Clean up
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          rm -rf "$WORKSPACE/artifacts" || true
          rm -rf "$WORKSPACE/build" || true
          rm -rf "$WORKSPACE/downloads" || true
          rm -rf "$WORKSPACE/archive-validation" || true
          rm -rf "$WORKSPACE/v4l-video-test-app/build" || true
          rm -rf "$WORKSPACE/qcomflash-staging" || true
          rm -f "$WORKSPACE/"*_build.tar || true
          rm -f "$WORKSPACE/"*_build.tar.gz || true
          rm -f "$WORKSPACE/"*_archive_manifest.txt || true
          rm -f "$(dirname "$WORKSPACE")/kas_local_conf_header.txt" || true

      - name: Update summary
        if: always()
        shell: bash
        env:
          MACHINE: ${{ matrix.build_matrix.machine }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
          PREBUILT_ARTIFACT: ${{ matrix.build_matrix.prebuilt_artifact }}
        run: |
          set -u

          if [ "$JOB_STATUS" = "success" ]; then
            summary=":heavy_check_mark: Build Success"
          else
            summary=":x: Build Failed"
          fi

          {
            echo "<details><summary><i>Build Summary</i></summary>"
            echo
            echo "$summary for $MACHINE"
            echo
            echo "**Event:** \`$EVENT_NAME\`"
            echo "**Commit:** \`$COMMIT_SHA\`"
            echo "**Machine:** \`$MACHINE\`"
            echo "**Prebuilt artifact:** \`$PREBUILT_ARTIFACT\`"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
