name: sync-and-build

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      build_matrix:
        description: Build matrix for multi-target builds
        type: string
        required: true

      commit_sha:
        description: Exact commit SHA to build
        type: string
        required: true

      source_repository:
        description: Repository containing the commit to build
        type: string
        required: true

    secrets:
      HYDRA_WIFI_PASSWORD:
        description: Password for the Hydra Wi-Fi network
        required: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 720

    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels:
        - self-hosted
        - video-stg-u2204-x64-large-od-ephem

    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pre-clean workspace
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          echo "=== Disk before clean ==="
          df -h

          rm -rf "$WORKSPACE/build/tmp" || true
          rm -f "$(dirname "$WORKSPACE")/kas_local_conf_header.txt" || true
          rm -f "$WORKSPACE/.hydra_wifi_password" || true
          rm -rf "$WORKSPACE/classes" || true

          echo "=== Disk after clean ==="
          df -h
          free -h

      - name: Validate build inputs
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          set -euo pipefail

          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA: $COMMIT_SHA"
            exit 1
          fi

          if ! [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid source repository: $SOURCE_REPOSITORY"
            exit 1
          fi

          echo "Source repository: $SOURCE_REPOSITORY"
          echo "Commit SHA:        $COMMIT_SHA"

      - name: Checkout exact HEAD commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify commit before build
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ inputs.source_repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          echo "========================================"
          echo "Event      : $EVENT_NAME"
          echo "Repository : $EXPECTED_REPOSITORY"
          echo "Input SHA  : $EXPECTED_SHA"
          echo "HEAD SHA   : $actual_sha"
          echo "Branch     : $REF_NAME"
          echo "Commit msg : $(git log -1 --pretty=format:'%s')"
          echo "Author     : $(git log -1 --pretty=format:'%an <%ae>')"
          echo "Date       : $(git log -1 --pretty=format:'%ci')"
          echo "========================================"

          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual  : $actual_sha"
            exit 1
          fi

          echo "Correct repository and commit checked out"

      - name: Validate matrix build configuration
        shell: bash
        env:
          MACHINE: '${{ matrix.build_matrix.machine }}'
          KAS_FILE: '${{ matrix.build_matrix.kas_file }}'
          LAVA_NAME: '${{ matrix.build_matrix.lavaname }}'
          BUILD_COMMAND: '${{ matrix.build_matrix.build_command }}'
          IMAGE_NAME: '${{ matrix.build_matrix.image_name }}'
        run: |
          set -euo pipefail

          echo "=== Matrix build configuration ==="
          echo "Machine:       $MACHINE"
          echo "KAS file:      $KAS_FILE"
          echo "Lava name:     ${LAVA_NAME:-<not-set>}"
          echo "Build command: $BUILD_COMMAND"
          echo "Image name:    $IMAGE_NAME"
          echo "=================================="

          if [ -z "$MACHINE" ]; then
            echo "::error::Matrix field 'machine' is empty"
            exit 1
          fi

          if [ -z "$KAS_FILE" ]; then
            echo "::error::Matrix field 'kas_file' is empty"
            exit 1
          fi

          if [ -z "$BUILD_COMMAND" ]; then
            echo "::error::Matrix field 'build_command' is empty"
            exit 1
          fi

          if [ -z "$IMAGE_NAME" ]; then
            echo "::error::Matrix field 'image_name' is empty"
            exit 1
          fi

      - name: Clone meta-qcom as sibling repository
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$WORKSPACE")"
          meta_qcom_dir="$parent_dir/meta-qcom"

          rm -rf "$meta_qcom_dir"

          git clone \
            --depth 1 \
            https://github.com/qualcomm-linux/meta-qcom \
            "$meta_qcom_dir"

          echo "=== Parent workspace ==="
          ls -la "$parent_dir"

          echo "=== meta-qcom/ci ==="
          ls -la "$meta_qcom_dir/ci" || true

      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Add swap space
        shell: bash
        run: |
          set -euo pipefail

          if sudo swapon --show | grep -q '/swapfile'; then
            echo "Swap already enabled"
          else
            sudo fallocate -l 16G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

          echo "=== Memory ==="
          free -h

      - name: Retag Docker image
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          docker tag \
            "artifacts.codelinaro.org/clo-420-qli-registry/$DOCKER_IMAGE" \
            "$DOCKER_IMAGE" || true

          docker images | grep -- "$DOCKER_IMAGE" || true

      - name: Prepare Hydra Wi-Fi password
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          HYDRA_WIFI_PASSWORD: ${{ secrets.HYDRA_WIFI_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${HYDRA_WIFI_PASSWORD:-}" ]; then
            echo "::error::HYDRA_WIFI_PASSWORD secret is empty or was not passed"
            exit 1
          fi

          password_file="$WORKSPACE/.hydra_wifi_password"

          umask 077
          printf '%s' "$HYDRA_WIFI_PASSWORD" > "$password_file"
          chmod 600 "$password_file"

          if [ ! -s "$password_file" ]; then
            echo "::error::Wi-Fi password file was not created or is empty"
            exit 1
          fi

          echo "✅ Hydra Wi-Fi password file prepared"

      - name: Create Wi-Fi post-boot BitBake class
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/classes"

          class_file="$WORKSPACE/classes/wifi-post-boot.bbclass"

          cat > "$class_file" << 'BBCLASS'
          WIFI_SSID ?= "Hydra"
          WIFI_PASSWORD_FILE ?= "/workspace/video-driver/.hydra_wifi_password"

          wifi_inject_nm_profile() {
              if [ ! -f "${WIFI_PASSWORD_FILE}" ]; then
                  bbfatal "Wi-Fi password file not found: ${WIFI_PASSWORD_FILE}"
              fi

              wifi_password="$(cat "${WIFI_PASSWORD_FILE}")"

              if [ -z "${wifi_password}" ]; then
                  bbfatal "Wi-Fi password file is empty: ${WIFI_PASSWORD_FILE}"
              fi

              nm_dir="${IMAGE_ROOTFS}${sysconfdir}/NetworkManager/system-connections"
              install -d "$nm_dir"

              cat > "$nm_dir/Hydra.nmconnection" << EOF
          [connection]
          id=Hydra
          uuid=$(cat /proc/sys/kernel/random/uuid)
          type=wifi
          autoconnect=true
          autoconnect-retries=-1

          [wifi]
          mode=infrastructure
          ssid=${WIFI_SSID}

          [wifi-security]
          auth-alg=open
          key-mgmt=wpa-psk
          psk=${wifi_password}

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          addr-gen-mode=stable-privacy
          EOF

              chmod 600 "$nm_dir/Hydra.nmconnection"

              bbnote "Installed Hydra NM connection profile to ${sysconfdir}/NetworkManager/system-connections/Hydra.nmconnection"
          }

          ROOTFS_POSTPROCESS_COMMAND:append = " wifi_inject_nm_profile;"
          BBCLASS

          chmod 644 "$class_file"

          echo "✅ Created Wi-Fi BitBake class: $class_file"
          echo "Class line count: $(wc -l < "$class_file")"

      - name: Verify Wi-Fi build files
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          test -f "$WORKSPACE/classes/wifi-post-boot.bbclass"
          test -f "$WORKSPACE/.hydra_wifi_password"

          echo "✅ Wi-Fi BitBake class exists"
          echo "✅ Wi-Fi password file exists"
          echo "Workspace: $WORKSPACE"

      - name: Build image
        uses: qualcomm-linux-stg/video-driver/.github/actions/build@job_render_main
        with:
          machine: ${{ matrix.build_matrix.machine }}
          docker_image: ${{ inputs.docker_image }}
          kas_file: ${{ matrix.build_matrix.kas_file }}
          build_command: ${{ matrix.build_matrix.build_command }}
          kas_local_conf_header: |
            BBPATH:prepend = "/workspace/video-driver:"
            BBPATH:prepend = "/workspace/video-driver/classes:"

            INHERIT:append = " wifi-post-boot"

            WIFI_SSID          = "Hydra"
            WIFI_PASSWORD_FILE = "/workspace/video-driver/.hydra_wifi_password"

            IMAGE_FEATURES += "enable-adbd"
            IMAGE_INSTALL:append = " git"

            HOSTTOOLS:remove = "ccache"
            INHERIT:remove = "ccache"

            EXTERNALSRC:pn-iris-video-dlkm = "/workspace/video-driver"
            EXTERNALSRC_BUILD:pn-iris-video-dlkm = "/workspace/video-driver/build_iris"
            S:pn-iris-video-dlkm = "${EXTERNALSRC}"
            B:pn-iris-video-dlkm = "${EXTERNALSRC_BUILD}"

            do_fetch:pn-iris-video-dlkm[noexec] = "1"
            do_unpack:pn-iris-video-dlkm[noexec] = "1"
            do_patch:pn-iris-video-dlkm[noexec] = "1"

            MAKE_TARGETS:pn-iris-video-dlkm = ""
            EXTRA_OEMAKE:pn-iris-video-dlkm = "-C ${STAGING_KERNEL_DIR} M=${S} modules"

            BB_NUMBER_THREADS = "6"
            PARALLEL_MAKE = "-j6"

      - name: Download iris_test_app from S3
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/v4l-video-test-app/build"

          aws s3 sync \
            "s3://qli-stg-video-gh-artifacts/qualcomm-linux-stg/video-driver/iris_test_app/" \
            "$WORKSPACE/v4l-video-test-app/build/"

          echo "✅ iris_test_app download complete"
          ls -la "$WORKSPACE/v4l-video-test-app/build/"

      - name: Download video contents
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE/downloads"

          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "$WORKSPACE/downloads/video_clips_iris.tar.gz"

          if [ ! -s "$WORKSPACE/downloads/video_clips_iris.tar.gz" ]; then
            echo "::error::Video contents download failed or file is empty"
            exit 1
          fi

          echo "✅ Video contents downloaded"
          ls -la "$WORKSPACE/downloads"

      - name: Inject Iris test app to rootfs
        uses: qualcomm-linux-stg/video-driver/.github/actions/inject@job_render_main
        with:
          docker_image: ${{ inputs.docker_image }}
          machine: ${{ matrix.build_matrix.machine }}

      - name: Prepare compressed build archive
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: '${{ matrix.build_matrix.machine }}'
          IMAGE_NAME: '${{ matrix.build_matrix.image_name }}'
        run: |
          set -euo pipefail

          deploy_dir="$WORKSPACE/build/tmp/deploy/images/$MACHINE"
          symlink_path="$deploy_dir/${IMAGE_NAME}-${MACHINE}.rootfs.qcomflash"
          archive_path="$WORKSPACE/${MACHINE}_build.tar.gz"

          echo "Machine:    $MACHINE"
          echo "Image name: $IMAGE_NAME"
          echo "Deploy dir: $deploy_dir"
          echo "qcomflash:  $symlink_path"

          if [ ! -L "$symlink_path" ]; then
            echo "::error::qcomflash symlink not found: $symlink_path"
            find "$deploy_dir" -maxdepth 2 -print | sort || true
            exit 1
          fi

          resolved_dir="$(readlink -f "$symlink_path")"

          if [ ! -d "$resolved_dir" ]; then
            echo "::error::Resolved qcomflash directory not found: $resolved_dir"
            exit 1
          fi

          if [ ! -f "$resolved_dir/rootfs.img" ]; then
            echo "::error::rootfs.img not found: $resolved_dir/rootfs.img"
            find "$resolved_dir" -maxdepth 2 -print | sort || true
            exit 1
          fi

          echo "=== qcomflash contents ==="
          find "$resolved_dir" -maxdepth 2 -type f -printf '%P\n' | sort

          rm -f "$archive_path"

          echo "=== Creating compressed build archive ==="
          if command -v pigz >/dev/null 2>&1; then
            tar -I "pigz -p $(nproc) -1" \
              -cf "$archive_path" \
              -C "$resolved_dir" \
              .
          else
            echo "pigz is not available; using gzip"
            tar -czf "$archive_path" \
              -C "$resolved_dir" \
              .
          fi

          if [ ! -s "$archive_path" ]; then
            echo "::error::Build archive was not created or is empty: $archive_path"
            exit 1
          fi

          echo "=== Verifying compressed archive contents ==="
          tar -tzf "$archive_path" | sed -n '1,200p'

          if ! tar -tzf "$archive_path" | grep -qE '(^|/)rootfs\.img$'; then
            echo "::error::rootfs.img is missing from $archive_path"
            exit 1
          fi

          echo "rootfs.img confirmed inside compressed archive"

          mkdir -p "$WORKSPACE/artifacts"
          printf '%s\n' "$archive_path" > "$WORKSPACE/artifacts/file_list.txt"

          echo "=== Single S3 upload file list ==="
          cat "$WORKSPACE/artifacts/file_list.txt"
          ls -lh "$archive_path"

      - name: Upload single build archive to S3
        uses: qualcomm-linux-stg/video-driver/.github/actions/aws_s3_helper@job_render_main
        with:
          s3_bucket: qli-stg-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.build_matrix.machine }}

      - name: Upload machine-specific pre-signed URLs
        uses: actions/upload-artifact@v4
        with:
          name: presigned-urls-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}/presigned_urls.json
          retention-days: 7
      - name: Upload single build archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.build_matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.build_matrix.machine }}_build.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Clean up
        if: always()
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          rm -f "$WORKSPACE/.hydra_wifi_password" || true
          rm -rf "$WORKSPACE/classes" || true
          rm -rf "$WORKSPACE/artifacts" || true
          rm -rf "$WORKSPACE/build" || true
          rm -rf "$WORKSPACE/downloads" || true
          rm -f "$WORKSPACE/"*_build.tar "$WORKSPACE/"*_build.tar.gz || true
          rm -f "$(dirname "$WORKSPACE")/kas_local_conf_header.txt" || true

      - name: Update summary
        if: always()
        shell: bash
        env:
          MACHINE: '${{ matrix.build_matrix.machine }}'
          BUILD_COMMAND: '${{ matrix.build_matrix.build_command }}'
          IMAGE_NAME: '${{ matrix.build_matrix.image_name }}'
          COMMIT_SHA: ${{ inputs.commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u

          if [ "$JOB_STATUS" = "success" ]; then
            summary=":heavy_check_mark: Build Success"
          else
            summary=":x: Build Failed"
          fi

          {
            echo "<details><summary><i>Build Summary</i></summary>"
            echo
            echo "$summary for $MACHINE"
            echo
            echo "**Machine:** \`$MACHINE\`"
            echo "**Image:** \`$IMAGE_NAME\`"
            echo "**Build command:** \`$BUILD_COMMAND\`"
            echo "**Event:** \`$EVENT_NAME\`"
            echo "**Commit:** \`$COMMIT_SHA\`"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"