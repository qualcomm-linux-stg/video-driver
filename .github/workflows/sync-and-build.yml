name: _build

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true
      build_matrix:
        description: Build matrix for multi target builds
        type: string
        required: true
      commit_sha:
        description: "Exact commit SHA to build (PR HEAD or push HEAD)"
        type: string
        required: true

jobs:
  build:
    timeout-minutes: 720
    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels: [self-hosted, video-stg-u2204-x64-large-od-ephem]
    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pre-clean workspace
        shell: bash
        run: |
          echo "=== Disk before clean ==="
          df -h
          rm -rf "${{ github.workspace }}/build/tmp" || true
          echo "=== Disk after clean ==="
          df -h
          free -h

      # ------------------------------------------------------------------ #
      #  Checkout the exact HEAD commit for push, PR and workflow_dispatch  #
      #  commit_sha is resolved in pre_merge.yml and passed down here.      #
      #  - pull_request      → github.event.pull_request.head.sha           #
      #  - push              → github.sha                                   #
      #  - workflow_dispatch → github.sha                                   #
      # ------------------------------------------------------------------ #
      - name: Checkout exact HEAD commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      #  Verify the checked-out commit matches expected SHA                 #
      #  AND confirm the PR diff is physically present in workspace         #
      #  before wasting 7+ hours on bitbake.                               #
      # ------------------------------------------------------------------ #
      - name: Verify commit and PR changes before build
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "  Event      : ${{ github.event_name }}"
          echo "  Input SHA  : ${{ inputs.commit_sha }}"
          echo "  HEAD SHA   : $(git rev-parse HEAD)"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Commit msg : $(git log -1 --pretty=format:'%s')"
          echo "  Author     : $(git log -1 --pretty=format:'%an <%ae>')"
          echo "  Date       : $(git log -1 --pretty=format:'%ci')"
          echo "========================================"

          # ✅ Confirm input SHA matches actual HEAD
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ inputs.commit_sha }}"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ SHA MISMATCH — wrong commit checked out!"
            echo "   Expected : $EXPECTED_SHA"
            echo "   Actual   : $ACTUAL_SHA"
            exit 1
          fi
          echo "✅ SHA verified — correct commit checked out"
          echo ""

          # ✅ Print lines around msm_vidc_probe.c line 1160
          # so we can visually confirm PR diff is present
          echo "--- Lines 1157-1165 of driver/vidc/src/msm_vidc_probe.c ---"
          sed -n '1157,1165p' driver/vidc/src/msm_vidc_probe.c || \
            echo "⚠️  File not found at expected path"
          echo "------------------------------------------------------------"

          # ✅ Show what changed vs base branch
          echo ""
          echo "--- Git diff HEAD vs origin/meta-qcom ---"
          git fetch origin meta-qcom --depth=1 2>/dev/null || true
          git diff origin/meta-qcom...HEAD -- \
            driver/vidc/src/msm_vidc_probe.c || true
          echo "------------------------------------------------------------"

      # ------------------------------------------------------------------ #
      #  NOTE: Sync step removed — checkout@v4 above already handles        #
      #  the correct commit for PR, push and workflow_dispatch events.      #
      # ------------------------------------------------------------------ #

      - name: Clone meta-qcom as sibling repo
        shell: bash
        run: |
          set -euo pipefail
          PARENT_DIR="$(dirname "${{ github.workspace }}")"
          META_QCOM_DIR="${PARENT_DIR}/meta-qcom"

          rm -rf "${META_QCOM_DIR}"
          git clone --depth 1 https://github.com/qualcomm-linux/meta-qcom "${META_QCOM_DIR}"

          echo "=== parent workspace ==="
          ls -la "${PARENT_DIR}"
          echo "=== meta-qcom/ci ==="
          ls -la "${META_QCOM_DIR}/ci" || true

      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Add swap space
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Memory after swap ==="
          free -h

      - name: Retag Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker tag \
            "artifacts.codelinaro.org/clo-420-qli-registry/${{ inputs.docker_image }}" \
            "${{ inputs.docker_image }}" || true
          docker images | grep kmake-image || true

      # ------------------------------------------------------------------ #
      #  Single kas invocation — KAS_LOCAL_CONF_HEADER injects the         #
      #  EXTERNALSRC overrides into build/conf/local.conf during kas init, #
      #  before bitbake runs. Yocto builds the already-checked-out         #
      #  video-driver workspace (exact PR/push HEAD commit) instead of     #
      #  fetching iris-video-dlkm from GitHub.                             #
      #                                                                    #
      #  IMPORTANT: Paths use /workspace/video-driver (container mount)    #
      #  NOT github.workspace (host path) — bitbake runs inside Docker.   #
      # ------------------------------------------------------------------ #
      - name: Build ${{ matrix.build_matrix.machine }}
        uses: qualcomm-linux-stg/video-driver/.github/actions/build@meta-qcom
        with:
          docker_image: ${{ inputs.docker_image }}
          kas_file: ${{ matrix.build_matrix.kas_file }}
          build_command: "bitbake qcom-multimedia-proprietary-image"
        env:
          machine: ${{ matrix.build_matrix.machine }}
          KAS_LOCAL_CONF_HEADER: |
            # === iris-video-dlkm CI override ===
            # Builds the exact checked-out commit (PR HEAD or push HEAD).
            # /workspace/video-driver = container mount of github.workspace
            EXTERNALSRC:pn-iris-video-dlkm = "/workspace/video-driver"
            EXTERNALSRC_BUILD:pn-iris-video-dlkm = "/workspace/video-driver/build_iris"
            S:pn-iris-video-dlkm = "${EXTERNALSRC}"
            B:pn-iris-video-dlkm = "${EXTERNALSRC_BUILD}"
            do_fetch:pn-iris-video-dlkm[noexec] = "1"
            do_unpack:pn-iris-video-dlkm[noexec] = "1"
            do_patch:pn-iris-video-dlkm[noexec] = "1"
            MAKE_TARGETS:pn-iris-video-dlkm = ""
            EXTRA_OEMAKE:pn-iris-video-dlkm = "-C ${STAGING_KERNEL_DIR} M=${S} modules"
            # === end iris-video-dlkm CI override ===

            # === OOM mitigation: limit parallel tasks ===
            BB_NUMBER_THREADS = "6"
            PARALLEL_MAKE = "-j6"

      - name: Download iris_test_app from S3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/v4l-video-test-app/build"
          echo "Syncing files from s3://qli-stg-video-gh-artifacts/qualcomm-linux-stg/video-driver/iris_test_app/"
          aws s3 sync \
            "s3://qli-stg-video-gh-artifacts/qualcomm-linux-stg/video-driver/iris_test_app/" \
            "${{ github.workspace }}/v4l-video-test-app/build/"
          echo "✅ Download complete"
          ls -la "${{ github.workspace }}/v4l-video-test-app/build/"

      - name: Download the video-contents for testing
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/downloads"
          echo "Downloading the video-content files"
          wget -q \
            "https://github.com/qualcomm-linux/qcom-linux-testkit/releases/download/IRIS-Video-Files-v1.0/video_clips_iris.tar.gz" \
            -O "${{ github.workspace }}/downloads/video_clips_iris.tar.gz"

          [ -f "$WORKSPACE/downloads/video_clips_iris.tar.gz" ] || {
            echo "❌ Failed to download video_clips_iris.tar.gz"
            exit 1
          }

          ls -la "${{ github.workspace }}/downloads/"

      - name: Inject Iris test app to rootfs
        uses: qualcomm-linux-stg/video-driver/.github/actions/inject@meta-qcom
        with:
          docker_image: ${{ inputs.docker_image }}
          machine: ${{ matrix.build_matrix.machine }}

      - name: Prepare .qcomflash files for S3 upload
        shell: bash
        run: |
          set -euo pipefail
          workspace="${{ github.workspace }}"
          machine="${{ matrix.build_matrix.machine }}"

          symlink_path="$workspace/build/tmp/deploy/images/$machine/qcom-multimedia-proprietary-image-${machine}.rootfs.qcomflash"

          if [ ! -L "$symlink_path" ]; then
            echo "❌ Symlink not found: $symlink_path"
            exit 1
          fi

          resolved_dir=$(readlink -f "$symlink_path")

          if [ ! -d "$resolved_dir" ]; then
            echo "❌ Resolved .qcomflash directory not found: $resolved_dir"
            exit 1
          fi

          ROOTFS_IMG="$resolved_dir/rootfs.img"
          if [ ! -f "$ROOTFS_IMG" ]; then
            echo "❌ rootfs.img not found at: $ROOTFS_IMG"
            exit 1
          fi

          echo "=== qcomflash contents ==="
          ls -larth "$resolved_dir"

          mkdir -p "$workspace/artifacts"
          : > "$workspace/artifacts/file_list.txt"

          FLASH_TAR="$workspace/${machine}_flash_files.tar"
          ROOTFS_DEST="$workspace/${machine}_rootfs.img"

          echo "📦 Creating flash_files.tar (excluding rootfs.img)..."
          tar -cf "$FLASH_TAR" \
            -C "$resolved_dir" \
            --exclude='./rootfs.img' \
            .
          echo "✅ flash_files.tar: $(ls -lh "$FLASH_TAR" | awk '{print $5}')"

          echo "📦 Copying injected rootfs.img..."
          cp "$ROOTFS_IMG" "$ROOTFS_DEST"
          echo "✅ rootfs.img: $(ls -lh "$ROOTFS_DEST" | awk '{print $5}')"

          echo "$FLASH_TAR"   >> "$workspace/artifacts/file_list.txt"
          echo "$ROOTFS_DEST" >> "$workspace/artifacts/file_list.txt"

          echo "=== Queued for upload ==="
          cat "$workspace/artifacts/file_list.txt"

      - name: Upload artifacts to S3
        id: upload-artifacts
        uses: qualcomm-linux-stg/video-driver/.github/actions/aws_s3_helper@meta-qcom
        with:
          s3_bucket: qli-stg-video-gh-artifacts
          local_file: ${{ github.workspace }}/artifacts/file_list.txt
          mode: multi-upload
          upload_location: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.build_matrix.machine }}
        env:
          machine: ${{ matrix.build_matrix.machine }}

      - name: Upload flash_files.tar to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flash-files-${{ matrix.build_matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.build_matrix.machine }}_flash_files.tar
          retention-days: 7
          compression-level: 0

      - name: Upload rootfs.img to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.build_matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/${{ matrix.build_matrix.machine }}_rootfs.img
          retention-days: 7
          compression-level: 0

      - name: Upload machine-specific presigned URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: presigned-urls-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}/presigned_urls.json
          retention-days: 3

      - name: Clean up
        if: always()
        shell: bash
        run: |
          rm -rf "${{ github.workspace }}/artifacts"           || true
          rm -rf "${{ github.workspace }}/build"               || true
          rm -rf "${{ github.workspace }}/downloads"           || true
          rm -f  "${{ github.workspace }}/"*_flash_files.tar   || true
          rm -f  "${{ github.workspace }}/"*_rootfs.img        || true

      - name: Update summary
        if: success() || failure()
        shell: bash
        run: |
          machine="${{ matrix.build_matrix.machine }}"
          run_id="${{ github.run_id }}"
          attempt="${{ github.run_attempt }}"
          commit="${{ inputs.commit_sha }}"

          if [ "${{ job.status }}" == "success" ]; then
            summary=":heavy_check_mark: Build Success for ${machine}"
          else
            summary=":x: Build Failed for ${machine}"
          fi

          artifact_flash="flash-files-${machine}-${run_id}-${attempt}"
          artifact_rootfs="rootfs-${machine}-${run_id}-${attempt}"

          echo -e "<details><summary><i>Build Summary</i></summary>\n\
          ${summary}\n\n\
          **Event:** \`${{ github.event_name }}\`\n\
          **Commit:** \`${commit}\`\n\n\
          **GitHub Artifacts (7-day retention):**\n\
          - \`${artifact_flash}\`\n\
          - \`${artifact_rootfs}\`\n\
          </details>" >> "$GITHUB_STEP_SUMMARY"