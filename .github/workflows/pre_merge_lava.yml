name: pre_merge_lava

run-name: LAVA Test - ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows:
      - pre_merge
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  verify-build:
    name: Verify completed build

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      }}

    runs-on: ubuntu-latest

    outputs:
      docker_image: ${{ steps.metadata.outputs.docker_image }}
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      build_run_id: ${{ steps.metadata.outputs.build_run_id }}
      build_repository: ${{ steps.metadata.outputs.build_repository }}
      pr_number: ${{ steps.metadata.outputs.pr_number }}

    steps:
      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
          name: build-metadata
          path: metadata

      - name: Read and validate build metadata
        id: metadata
        shell: bash
        env:
          METADATA_FILE: metadata/build-metadata.json
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail

          if [ ! -f "$METADATA_FILE" ]; then
            echo "::error::Build metadata was not found"
            find metadata -maxdepth 3 -type f -print || true
            exit 1
          fi

          jq empty "$METADATA_FILE"
          jq . "$METADATA_FILE"

          metadata_run_id="$(jq -r '.build_run_id // empty' "$METADATA_FILE")"
          metadata_repository="$(jq -r '.repository // empty' "$METADATA_FILE")"
          docker_image="$(jq -r '.docker_image // empty' "$METADATA_FILE")"
          commit_sha="$(jq -r '.commit_sha // empty' "$METADATA_FILE")"
          source_repository="$(jq -r '.source_repository // empty' "$METADATA_FILE")"
          pr_number="$(jq -r '.pr_number // empty' "$METADATA_FILE")"
          build_matrix="$(jq -c '.build_matrix' "$METADATA_FILE")"

          if [ "$metadata_run_id" != "$EXPECTED_RUN_ID" ]; then
            echo "::error::Metadata run ID does not match workflow_run ID"
            exit 1
          fi

          if [ "$metadata_repository" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::Metadata repository does not match workflow repository"
            exit 1
          fi

          if [ -z "$docker_image" ] || [ "$docker_image" = "null" ]; then
            echo "::error::docker_image is missing from metadata"
            exit 1
          fi

          if ! [[ "$commit_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA in metadata: $commit_sha"
            exit 1
          fi

          if [ -z "$source_repository" ] ||
             [ "$source_repository" = "null" ]; then
            echo "::error::source_repository is missing from metadata"
            exit 1
          fi

          if ! [[ "$source_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid source repository in metadata: $source_repository"
            exit 1
          fi

          if [ "$(jq -r 'type' <<< "$build_matrix")" != "array" ]; then
            echo "::error::build_matrix must be a JSON array"
            exit 1
          fi

          {
            echo "docker_image=$docker_image"
            echo "commit_sha=$commit_sha"
            echo "build_run_id=$metadata_run_id"
            echo "build_repository=$metadata_repository"
            echo "pr_number=$pr_number"

            echo "build_matrix<<BUILD_MATRIX_EOF"
            echo "$build_matrix"
            echo "BUILD_MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

  create-lava-check:
    name: Create LAVA PR check

    needs:
      - verify-build

    if: >-
      ${{
        always() &&
        needs.verify-build.result == 'success' &&
        needs.verify-build.outputs.pr_number != ''
      }}

    runs-on: ubuntu-latest

    outputs:
      check_run_id: ${{ steps.create-check.outputs.check_run_id }}

    steps:
      - name: Create pending LAVA check
        id: create-check
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.verify-build.outputs.commit_sha }}
          PR_NUMBER: ${{ needs.verify-build.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;

            const result = await github.rest.checks.create({
              owner,
              repo,
              name: 'LAVA Test',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              output: {
                title: 'LAVA tests are running',
                summary: `LAVA tests started for pull request #${process.env.PR_NUMBER}.`
              }
            });

            core.setOutput('check_run_id', String(result.data.id));

  lava-test:
    name: Run LAVA tests

    # Important:
    # Do not add create-lava-check here.
    # The PR check must not block the LAVA workflow.
    needs:
      - verify-build

    if: ${{ needs.verify-build.result == 'success' }}

    uses: qualcomm-linux-stg/video-driver/.github/workflows/test.yml@kodiak_testing

    with:
      docker_image: ${{ needs.verify-build.outputs.docker_image }}
      build_matrix: ${{ needs.verify-build.outputs.build_matrix }}
      commit_sha: ${{ needs.verify-build.outputs.commit_sha }}
      build_run_id: ${{ needs.verify-build.outputs.build_run_id }}
      build_repository: ${{ needs.verify-build.outputs.build_repository }}

    secrets:
      LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
      LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}

  complete-lava-check:
    name: Complete LAVA PR check

    needs:
      - create-lava-check
      - lava-test

    if: >-
      ${{
        always() &&
        needs.create-lava-check.result == 'success' &&
        needs.create-lava-check.outputs.check_run_id != ''
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Update LAVA check
        uses: actions/github-script@v7
        env:
          CHECK_RUN_ID: ${{ needs.create-lava-check.outputs.check_run_id }}
          LAVA_RESULT: ${{ needs.lava-test.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const checkRunId = Number(process.env.CHECK_RUN_ID);
            const lavaResult = process.env.LAVA_RESULT;

            let conclusion = 'failure';
            let title = 'LAVA tests failed';
            let summary = 'The LAVA reusable workflow failed.';

            if (lavaResult === 'success') {
              conclusion = 'success';
              title = 'LAVA tests passed';
              summary = 'The LAVA reusable workflow completed successfully.';
            } else if (lavaResult === 'cancelled') {
              conclusion = 'cancelled';
              title = 'LAVA tests cancelled';
              summary = 'The LAVA reusable workflow was cancelled.';
            }

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion,
              output: {
                title,
                summary
              }
            });