name: pre_merge_lava
run-name: LAVA Test - ${{ github.event.workflow_run.display_title }}
on:
  # This workflow intentionally consumes artifacts from the completed
  # pre_merge workflow. The triggering workflow is restricted below to
  # successful runs from the expected repository and supported events.
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - pre_merge
    types:
      - completed
permissions:
  actions: read
  contents: read
jobs:
  verify-build:
    name: Verify completed build
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.metadata.outputs.docker_image }}
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      build_run_id: ${{ steps.metadata.outputs.build_run_id }}
      build_repository: ${{ steps.metadata.outputs.build_repository }}
    steps:
      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          run-id: ${{ github.event.workflow_run.id }}
          name: build-metadata
          path: metadata
      - name: Read and validate build metadata
        id: metadata
        shell: bash
        env:
          METADATA_FILE: metadata/build-metadata.json
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail
          if [ ! -f "$METADATA_FILE" ]; then
            echo "::error::Build metadata was not found"
            find metadata -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "=== Build metadata ==="
          jq empty "$METADATA_FILE"
          jq . "$METADATA_FILE"
          METADATA_RUN_ID="$(
            jq -r '.build_run_id // empty' "$METADATA_FILE"
          )"
          METADATA_REPOSITORY="$(
            jq -r '.repository // empty' "$METADATA_FILE"
          )"
          DOCKER_IMAGE="$(
            jq -r '.docker_image // empty' "$METADATA_FILE"
          )"
          COMMIT_SHA="$(
            jq -r '.commit_sha // empty' "$METADATA_FILE"
          )"
          SOURCE_REPOSITORY="$(
            jq -r '.source_repository // empty' "$METADATA_FILE"
          )"
          BUILD_MATRIX="$(
            jq -c '.build_matrix' "$METADATA_FILE"
          )"
          if [ "$METADATA_RUN_ID" != "$EXPECTED_RUN_ID" ]; then
            echo "::error::Metadata run ID does not match workflow_run ID"
            echo "Metadata run ID: $METADATA_RUN_ID"
            echo "Expected run ID: $EXPECTED_RUN_ID"
            exit 1
          fi
          if [ "$METADATA_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "::error::Metadata repository does not match workflow repository"
            echo "Metadata repository: $METADATA_REPOSITORY"
            echo "Expected repository: $EXPECTED_REPOSITORY"
            exit 1
          fi
          if [ -z "$DOCKER_IMAGE" ] || [ "$DOCKER_IMAGE" = "null" ]; then
            echo "::error::docker_image is missing from metadata"
            exit 1
          fi
          if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" = "null" ]; then
            echo "::error::commit_sha is missing from metadata"
            exit 1
          fi
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA in metadata: $COMMIT_SHA"
            exit 1
          fi
          if [ -z "$SOURCE_REPOSITORY" ] ||
            [ "$SOURCE_REPOSITORY" = "null" ]; then
            echo "::error::source_repository is missing from metadata"
            exit 1
          fi
          if ! [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid source repository in metadata: $SOURCE_REPOSITORY"
            exit 1
          fi
          if [ "$(echo "$BUILD_MATRIX" | jq -r 'type')" != "array" ]; then
            echo "::error::build_matrix must be a JSON array"
            exit 1
          fi
          echo "Docker image:      $DOCKER_IMAGE"
          echo "Commit SHA:        $COMMIT_SHA"
          echo "Source repository: $SOURCE_REPOSITORY"
          echo "Build repository:  $METADATA_REPOSITORY"
          echo "Build run ID:      $METADATA_RUN_ID"
          {
            echo "docker_image=$DOCKER_IMAGE"
            echo "commit_sha=$COMMIT_SHA"
            echo "build_run_id=$METADATA_RUN_ID"
            echo "build_repository=$METADATA_REPOSITORY"
          } >> "$GITHUB_OUTPUT"
          {
            echo "build_matrix<<BUILD_MATRIX_EOF"
            echo "$BUILD_MATRIX"
            echo "BUILD_MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

  start-check:
    name: Start LAVA Test check
    needs:
      - verify-build
    if: ${{ needs.verify-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write
    outputs:
      check_id: ${{ steps.create.outputs.check_id }}
    steps:
      - name: Create in-progress LAVA Test check on PR head SHA
        id: create
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.verify-build.outputs.commit_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'LAVA Test',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title: 'LAVA Test: running',
                summary: `LAVA tests are running.\n\n[View workflow run](${runUrl})`
              }
            });
            core.setOutput('check_id', data.id);

  lava-test:
    name: Run LAVA tests
    needs:
      - verify-build
      - start-check
    if: ${{ needs.verify-build.result == 'success' }}
    # A reusable workflow cannot receive more permissions than its caller job.
    permissions:
      actions: read
      contents: read
    uses: qualcomm-linux-stg/video-driver/.github/workflows/test.yml@job_render_main
    with:
      docker_image: ${{ needs.verify-build.outputs.docker_image }}
      build_matrix: ${{ needs.verify-build.outputs.build_matrix }}
      commit_sha: ${{ needs.verify-build.outputs.commit_sha }}
      build_run_id: ${{ needs.verify-build.outputs.build_run_id }}
      build_repository: ${{ needs.verify-build.outputs.build_repository }}
    secrets:
      LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
      LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}

  finish-check:
    name: Publish LAVA Test result to PR
    needs:
      - verify-build
      - start-check
      - lava-test
    if: ${{ always() && needs.start-check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download LAVA result artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lava-results-*
          path: lava-results

      - name: Complete check run and comment on PR
        uses: actions/github-script@v7
        env:
          LAVA_RESULT: ${{ needs.lava-test.result }}
          HEAD_SHA: ${{ needs.verify-build.outputs.commit_sha }}
          CHECK_ID: ${{ needs.start-check.outputs.check_id }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const result = process.env.LAVA_RESULT;
            const sha = process.env.HEAD_SHA;
            const checkId = Number(process.env.CHECK_ID);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const conclusion =
              result === 'success' ? 'success' :
              result === 'skipped' ? 'neutral' :
              result === 'cancelled' ? 'cancelled' : 'failure';

            // ---- Collect per-machine testcase results from artifacts ----
            const root = 'lava-results';
            const machines = [];
            if (fs.existsSync(root)) {
              for (const dir of fs.readdirSync(root).sort()) {
                const full = path.join(root, dir);
                if (!fs.statSync(full).isDirectory()) continue;
                const machine = dir.replace(/^lava-results-/, '');
                const files = fs.readdirSync(full);
                const tcFile = files.find(f => /^lava-testcase-results-\d+\.txt$/.test(f));
                const jobId = tcFile ? tcFile.match(/(\d+)/)[1] : null;
                const cases = [];
                if (tcFile) {
                  const lines = fs.readFileSync(path.join(full, tcFile), 'utf8').split('\n');
                  for (const line of lines) {
                    if (!line.trim()) continue;
                    const [id, res] = line.split('\t');
                    cases.push({ id, res: (res || '').trim() });
                  }
                }
                const isPass = r => ['pass', 'passed'].includes(r.toLowerCase());
                const passed = cases.filter(c => isPass(c.res)).length;
                machines.push({
                  machine, jobId, cases, passed,
                  failed: cases.length - passed
                });
              }
            }

            // ---- Build the summary ----
            const icon = conclusion === 'success' ? '✅' :
                         conclusion === 'neutral' ? '⚪' : '❌';
            let summary = `## ${icon} LAVA Test: ${result}\n\n`;
            summary += `Commit: \`${sha.slice(0, 7)}\`  \n`;
            summary += `[View workflow run](${runUrl})\n\n`;

            if (machines.length) {
              summary += '| Machine | LAVA job | Total | Passed | Failed |\n';
              summary += '|---|---|---|---|---|\n';
              for (const m of machines) {
                const job = m.jobId
                  ? `[${m.jobId}](https://lava-oss.qualcomm.com/scheduler/job/${m.jobId})`
                  : 'n/a';
                summary += `| \`${m.machine}\` | ${job} | ${m.cases.length} | ${m.passed} | ${m.failed} |\n`;
              }
              for (const m of machines) {
                const bad = m.cases.filter(c => !['pass', 'passed'].includes(c.res.toLowerCase()));
                if (bad.length) {
                  summary += `\n**Failed testcases on \`${m.machine}\`:**\n`;
                  for (const c of bad.slice(0, 50)) {
                    summary += `- \`${c.id}\`: \`${c.res}\`\n`;
                  }
                }
              }
            } else {
              summary += '_No testcase results were found. Check the workflow run for details._\n';
            }

            if (summary.length > 60000) {
              summary = summary.slice(0, 60000) + '\n\n_...truncated_';
            }

            // ---- Complete the check run ----
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title: `LAVA Test: ${result}`,
                summary
              }
            });

            // ---- Find the PR number(s) ----
            let prNumbers = [];
            if (process.env.WR_PR_NUMBER) {
              prNumbers = [Number(process.env.WR_PR_NUMBER)];
            } else {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha
              });
              prNumbers = prs.filter(p => p.state === 'open').map(p => p.number);
            }

            // ---- Create or update one sticky comment per PR ----
            const marker = '<!-- lava-test-result -->';
            const body = `${marker}\n${summary}`;
            for (const issue_number of prNumbers) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body
                });
              }
            }