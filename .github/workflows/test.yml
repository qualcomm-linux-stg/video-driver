name: test

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      build_matrix:
        description: Build matrix as stringified JSON
        type: string
        required: true

      commit_sha:
        description: Exact commit SHA tested
        type: string
        required: true

      build_run_id:
        description: Build workflow run ID containing the artifacts
        type: string
        required: true

      build_repository:
        description: Repository containing the build artifacts
        type: string
        required: true

    secrets:
      LAVA_OSS_TOKEN:
        description: LAVA authentication token
        required: true

      LAVA_OSS_USER:
        description: LAVA username
        required: true

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: LAVA test - ${{ matrix.build_matrix.machine }}

    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels:
        - self-hosted
        - video-stg-u2204-x64-large-od-ephem

    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        if: ${{ matrix.build_matrix.lavaname != '' }}
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Retag Docker image
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          source_image="artifacts.codelinaro.org/clo-420-qli-registry/$DOCKER_IMAGE"

          docker tag "$source_image" "$DOCKER_IMAGE" || true

          docker image inspect "$DOCKER_IMAGE" >/dev/null

      - name: Record tested commit
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_REPOSITORY: ${{ inputs.build_repository }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA: $COMMIT_SHA"
            exit 1
          fi

          echo "Build repository: $BUILD_REPOSITORY"
          echo "Build run ID:     $BUILD_RUN_ID"
          echo "Commit SHA:       $COMMIT_SHA"
          echo "Machine:          $MACHINE"

          {
            echo "## LAVA Test Provenance"
            echo ""
            echo "- Repository: \`$BUILD_REPOSITORY\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Build run: \`$BUILD_RUN_ID\`"
            echo "- Machine: \`$MACHINE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download machine-scoped presigned URLs
        if: ${{ matrix.build_matrix.lavaname != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ inputs.build_repository }}
          run-id: ${{ inputs.build_run_id }}
          name: presigned-urls-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}

      - name: Verify presigned_urls.json
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          presigned_file="$WORKSPACE/presigned_urls.json"
          flash_key="${MACHINE}_flash_files.tar"
          rootfs_key="${MACHINE}_rootfs.img"

          if [ ! -f "$presigned_file" ]; then
            echo "::error::presigned_urls.json not found"
            ls -la "$WORKSPACE"
            exit 1
          fi

          jq empty "$presigned_file"

          echo "=== presigned_urls.json keys ==="
          jq -r 'keys[]' "$presigned_file"

          flash_url="$(
            jq -r --arg key "$flash_key" '.[$key] // empty' "$presigned_file"
          )"

          if [ -z "$flash_url" ]; then
            echo "::error::Complete flash artifact URL is missing"
            echo "::error::Expected key: $flash_key"
            exit 1
          fi

          echo "Complete flash artifact found: $flash_key"

          if jq -e --arg key "$rootfs_key" 'has($key)' "$presigned_file" >/dev/null; then
            echo "::warning::Separate rootfs artifact exists but will not be used"
            echo "::warning::Key: $rootfs_key"
          fi

      - name: Clone LAVA job render scripts
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$GITHUB_WORKSPACE")"
          job_render_dir="$parent_dir/job_render"

          rm -rf "$job_render_dir"

          git clone \
            --depth 1 \
            https://github.com/Manigurr/job_render \
            "$job_render_dir"

          echo "job_render cloned"

          echo "=== job_render commit ==="
          git -C "$job_render_dir" rev-parse HEAD
          git -C "$job_render_dir" branch --show-current

          echo "=== flasher template ==="
          sed -n '1,60p' "$job_render_dir/templates/boot/flasher.jinja2" || true

      - name: Verify job_render template
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$GITHUB_WORKSPACE")"
          job_render_dir="$parent_dir/job_render"
          template="$job_render_dir/templates/boot/flasher.jinja2"

          if [ ! -f "$template" ]; then
            echo "::error::Missing flasher template: $template"
            exit 1
          fi

          echo "=== Active flasher template ==="
          sed -n '1,240p' "$template"

          echo "=== Checking for stale unsafe command ==="

          if grep -Fq "grep -Rni" "$template"; then
            echo "::error::Unsafe diagnostic grep command remains in flasher.jinja2"
            grep -n "grep -Rni" "$template"
            exit 1
          fi

          if grep -Fq "label=" "$template"; then
            echo "::error::Manual rawprogram label patch must not be present"
            grep -n "label=" "$template"
            exit 1
          fi

          echo "flasher.jinja2 validation passed"

      - name: Verify job_render path
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$GITHUB_WORKSPACE")"
          job_render_dir="$parent_dir/job_render"

          test -d "$job_render_dir"
          test -f "$job_render_dir/lava_Job_definition_generator.py"
          test -d "$job_render_dir/templates"
          test -f "$job_render_dir/templates/boot/flasher.jinja2"

          echo "job_render path verified: $job_render_dir"

      - name: Render LAVA job definition
        if: ${{ matrix.build_matrix.lavaname != '' }}
        uses: qualcomm-linux-stg/video-driver/.github/actions/lava_job_render@kodiak_testing
        with:
          docker_image: ${{ inputs.docker_image }}
          machine: ${{ matrix.build_matrix.machine }}
          lavaname: ${{ matrix.build_matrix.lavaname }}
          presigned_urls_file: ${{ github.workspace }}/presigned_urls.json

      - name: Verify rendered LAVA job
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$WORKSPACE")"
          job_render_dir="$parent_dir/job_render"
          job_file="$job_render_dir/renders/lava_job_definition.yaml"

          if [ ! -f "$job_file" ]; then
            echo "::error::Rendered LAVA job not found: $job_file"
            find "$job_render_dir" -maxdepth 8 -type f -print | sort || true
            exit 1
          fi

          if [ ! -s "$job_file" ]; then
            echo "::error::Rendered LAVA job is empty: $job_file"
            exit 1
          fi

          echo "=== Rendered LAVA job ==="
          sed -n '1,300p' "$job_file"

      - name: Verify complete-qcomflash configuration
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$WORKSPACE")"
          job_file="$parent_dir/job_render/renders/lava_job_definition.yaml"

          grep -q '^device_type:' "$job_file"
          grep -q 'flash_files:' "$job_file"
          grep -q 'combined_flash.tar' "$job_file"

          if grep -q 'rootfs_img:' "$job_file"; then
            echo "::error::Separate rootfs_img is present"
            exit 1
          fi

          if grep -q 'ROOTFS_IMAGE' "$job_file"; then
            echo "::error::ROOTFS_IMAGE must not be used"
            exit 1
          fi

          if grep -q 'ROOTFS_PARTITION' "$job_file"; then
            echo "::error::ROOTFS_PARTITION must not be used"
            exit 1
          fi

          if grep -q 'rawprogram.*xml' "$job_file"; then
            echo "::error::Manual rawprogram XML patching must not be used"
            exit 1
          fi

          echo "Complete-qcomflash configuration verified"

      - name: Verify LAVA Docker environment
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          docker image inspect "$DOCKER_IMAGE" >/dev/null

          docker run --rm \
            "$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail
              command -v lavacli
              lavacli --version
              getent hosts lava-oss.qualcomm.com
            '

      - name: Submit LAVA job
        if: ${{ matrix.build_matrix.lavaname != '' }}
        id: submit_job
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          if [ -z "${LAVA_OSS_TOKEN:-}" ]; then
            echo "::error::LAVA_OSS_TOKEN is unavailable"
            exit 1
          fi

          if [ -z "${LAVA_OSS_USER:-}" ]; then
            echo "::error::LAVA_OSS_USER is unavailable"
            exit 1
          fi

          parent_dir="$(dirname "$WORKSPACE")"
          job_render_dir="$parent_dir/job_render"
          job_file="$job_render_dir/renders/lava_job_definition.yaml"
          submission_log="$WORKSPACE/lava-submit-output.txt"

          if [ ! -f "$job_file" ]; then
            echo "::error::LAVA job file not found: $job_file"
            exit 1
          fi

          set +e

          docker run -i --rm \
            --workdir="$job_render_dir" \
            --mount "type=bind,src=$parent_dir,dst=$parent_dir" \
            -e LAVA_OSS_TOKEN \
            -e LAVA_OSS_USER \
            "$DOCKER_IMAGE" \
            bash -s 2>&1 <<'CONTAINER_SCRIPT' | tee "$submission_log"
          set -euo pipefail

          lavacli identities add \
            --token "$LAVA_OSS_TOKEN" \
            --uri https://lava-oss.qualcomm.com/RPC2 \
            --username "$LAVA_OSS_USER" \
            production

          lavacli -i production jobs submit \
            ./renders/lava_job_definition.yaml
          CONTAINER_SCRIPT

          docker_status="${PIPESTATUS[0]}"

          set -e

          if [ "$docker_status" -ne 0 ]; then
            echo "::error::LAVA submission failed with exit code $docker_status"
            cat "$submission_log"
            exit "$docker_status"
          fi

          job_id="$(
            grep -Eo '(^|[^0-9])[0-9]{1,}([^0-9]|$)' "$submission_log" |
              grep -Eo '[0-9]+' |
              tail -n 1 |
              tr -d '[:space:]'
          )"

          if ! [[ "$job_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to extract a numeric LAVA job ID"
            cat "$submission_log"
            exit 1
          fi

          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"

          echo "JOB_ID=$job_id" >> "$GITHUB_ENV"
          echo "JOB_URL=$job_url" >> "$GITHUB_ENV"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "job_url=$job_url" >> "$GITHUB_OUTPUT"

          echo "LAVA job submitted: $job_id"
          echo "LAVA job URL: $job_url"

          echo "::notice title=LAVA job submitted::$job_id"
          echo "::notice title=LAVA job URL::$job_url"

          {
            echo "### LAVA Job Submitted"
            echo ""
            echo "- Machine: \`$MACHINE\`"
            echo "- Job ID: [$job_id]($job_url)"
            echo "- Job URL: $job_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LAVA submission log
        if: ${{ always() && matrix.build_matrix.lavaname != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lava-submit-log-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}/lava-submit-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save job ID
        if: ${{ always() && matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          MACHINE: ${{ matrix.build_matrix.machine }}
          JOB_ID: ${{ env.JOB_ID }}
          JOB_URL: ${{ env.JOB_URL }}
        run: |
          set -euo pipefail

          job_id="${JOB_ID:-unknown}"

          if [ -n "${JOB_URL:-}" ]; then
            job_url="$JOB_URL"
          elif [ "$job_id" != "unknown" ]; then
            job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"
          else
            job_url="unknown"
          fi

          jq -n \
            --arg id "$job_id" \
            --arg machine "$MACHINE" \
            --arg url "$job_url" \
            '{
              id: $id,
              machine: $machine,
              url: $url
            }' > "lava-job-${MACHINE}.json"

          echo "Saved LAVA job data:"
          cat "lava-job-${MACHINE}.json"

      - name: Upload job ID artifact
        if: ${{ always() && matrix.build_matrix.lavaname != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lava-job-data-${{ matrix.build_matrix.machine }}
          path: lava-job-${{ matrix.build_matrix.machine }}.json
          retention-days: 7

      - name: Poll LAVA job
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          job_id="${JOB_ID:-}"

          if [ -z "$job_id" ] || [ "$job_id" = "unknown" ]; then
            echo "::error::No valid LAVA job ID available"
            exit 1
          fi

          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"

          echo "Waiting for LAVA job $job_id"
          echo "LAVA job URL: $job_url"

          parent_dir="$(dirname "$WORKSPACE")"
          job_render_dir="$parent_dir/job_render"

          state=""
          health=""
          start_time="$(date +%s)"
          timeout_seconds=$((4 * 60 * 60))

          get_lava_field() {
            local content="$1"
            local field="$2"

            printf '%s\n' "$content" |
              sed -nE \
                "s/^[[:space:]]*-?[[:space:]]*${field}[[:space:]]*:[[:space:]]*(.*)[[:space:]]*$/\1/pI" |
              head -n 1 |
              xargs
          }

          while [ "$state" != "Finished" ]; do
            job_info="$(
              docker run -i --rm \
                --workdir="$job_render_dir" \
                --mount "type=bind,src=$parent_dir,dst=$parent_dir" \
                -e LAVA_OSS_TOKEN \
                -e LAVA_OSS_USER \
                "$DOCKER_IMAGE" \
                bash -c '
                  set -euo pipefail

                  lavacli identities add \
                    --token "$LAVA_OSS_TOKEN" \
                    --uri https://lava-oss.qualcomm.com/RPC2 \
                    --username "$LAVA_OSS_USER" \
                    production >/dev/null 2>&1 || true

                  lavacli -i production jobs show "$1"
                ' bash "$job_id"
            )"

            state="$(get_lava_field "$job_info" state)"
            health="$(get_lava_field "$job_info" Health)"

            echo "State: ${state:-UNKNOWN}; Health: ${health:-UNKNOWN}; URL: $job_url"

            if [ "$state" = "Finished" ]; then
              break
            fi

            elapsed=$(( "$(date +%s)" - start_time ))

            if [ "$elapsed" -ge "$timeout_seconds" ]; then
              echo "::error::LAVA timeout reached after four hours"
              echo "::error::LAVA job URL: $job_url"
              exit 1
            fi

            sleep 30
          done

          {
            echo "### LAVA Job Completed"
            echo ""
            echo "- Job ID: [$job_id]($job_url)"
            echo "- State: \`${state:-UNKNOWN}\`"
            echo "- Health: \`${health:-UNKNOWN}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$health" = "Canceled" ]; then
            echo "::error::LAVA job was canceled"
            echo "::error::LAVA job URL: $job_url"
            exit 1
          fi

          docker run -i --rm \
            --workdir="$job_render_dir" \
            --mount "type=bind,src=$parent_dir,dst=$parent_dir" \
            -e LAVA_OSS_TOKEN \
            -e LAVA_OSS_USER \
            "$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail

              lavacli identities add \
                --token "$LAVA_OSS_TOKEN" \
                --uri https://lava-oss.qualcomm.com/RPC2 \
                --username "$LAVA_OSS_USER" \
                production >/dev/null 2>&1 || true

              lavacli -i production results "$1"
            ' bash "$job_id" > "$WORKSPACE/lava_results.txt"

          echo "=== Raw LAVA results ==="
          cat "$WORKSPACE/lava_results.txt"

          results="$(
            grep -E \
              '^\* 0_video_pre-merge-tests\.Video_V4L2_Runner \[(pass|fail)\]' \
              "$WORKSPACE/lava_results.txt" || true
          )"

          if [ -z "$results" ]; then
            echo "::error::Video_V4L2_Runner result was not found"
            echo "::error::LAVA job URL: $job_url"
            exit 1
          fi

          echo "Found: $results"

          if echo "$results" | grep -q '\[fail\]'; then
            echo "::error::Video_V4L2_Runner failed"
            echo "::error::LAVA job URL: $job_url"
            exit 1
         2 actions/download-artifact@v4
        with:
          pattern: lava-job-data-*
          merge-multiple: true
          path: artifacts

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq curl

      - name: Generate LAVA summary
        shell: bash
        env:
          LAVA_URL: https://lava-oss.qualcomm.com
          LAVA_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${LAVA_TOKEN:-}" ]; then
            echo "::error::LAVA token is unavailable"
            exit 1
          fi

          summary_file="$GITHUB_WORKSPACE/step-summary.md"

          {
            echo "### LAVA Test Summary"
            echo ""
            echo "| Job ID | Machine | State | Health | Link |"
            echo "| :--- | :--- | :--- | :--- | :--- |"

            find artifacts -name 'lava-job-*.json' -print0 |
            while IFS= read -r -d '' file; do
              job_id="$(jq -r '.id // "unknown"' "$file")"
              machine="$(jq -r '.machine // "unknown"' "$file")"
              saved_url="$(jq -r '.url // empty' "$file")"

              if [ -z "$job_id" ] || [ "$job_id" = "unknown" ]; then
                printf '| - | %s | Not submitted | - | - |\n' "$machine"
                continue
              fi

              url="$saved_url"

              if [ -z "$url" ] || [ "$url" = "unknown" ]; then
                url="$LAVA_URL/scheduler/job/$job_id"
              fi

              details="$(
                curl -sf \
                  -H "Authorization: Token $LAVA_TOKEN" \
                  "$LAVA_URL/api/v0.2/jobs/$job_id/" || true
              )"

              if [ -n "$details" ]; then
                state="$(printf '%s' "$details" | jq -r '.state // "unknown"')"
                health="$(printf '%s' "$details" | jq -r '.health // "unknown"')"
              else
                state="unknown"
                health="unknown"
              fi

              printf '| %s | %s | %s | %s | [View](%s) |\n' \
                "$job_id" \
                "$machine" \
                "$state" \
                "$health" \
                "$url"
            done
          } | tee "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lava-summary-report
          path: step-summary.md
          retention-days: 7