name: test

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      build_matrix:
        description: Build matrix as stringified JSON
        type: string
        required: true

      commit_sha:
        description: Exact commit SHA tested
        type: string
        required: true

      build_run_id:
        description: Build workflow run ID containing the artifacts
        type: string
        required: true

      build_repository:
        description: Repository containing the build artifacts
        type: string
        required: true

    secrets:
      LAVA_OSS_TOKEN:
        description: LAVA authentication token
        required: true

      LAVA_OSS_USER:
        description: LAVA username
        required: true

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: LAVA test - ${{ matrix.build_matrix.machine }}

    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels:
        - self-hosted
        - video-stg-u2204-x64-large-od-ephem

    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJson(inputs.build_matrix) }}

    steps:
      - name: Pull Docker image
        if: ${{ matrix.build_matrix.lavaname != '' }}
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Retag Docker image
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          source_image="artifacts.codelinaro.org/clo-420-qli-registry/$DOCKER_IMAGE"

          docker tag "$source_image" "$DOCKER_IMAGE" || true
          docker image inspect "$DOCKER_IMAGE" >/dev/null

      - name: Record tested commit
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_REPOSITORY: ${{ inputs.build_repository }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA: $COMMIT_SHA"
            exit 1
          fi

          echo "Build repository: $BUILD_REPOSITORY"
          echo "Build run ID:     $BUILD_RUN_ID"
          echo "Commit SHA:       $COMMIT_SHA"
          echo "Machine:          $MACHINE"

          {
            echo "## LAVA Test Provenance"
            echo
            echo "- Repository: \`$BUILD_REPOSITORY\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Build run: \`$BUILD_RUN_ID\`"
            echo "- Machine: \`$MACHINE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download machine-scoped presigned URLs
        if: ${{ matrix.build_matrix.lavaname != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ inputs.build_repository }}
          run-id: ${{ inputs.build_run_id }}
          name: presigned-urls-${{ matrix.build_matrix.machine }}
          path: ${{ github.workspace }}

      - name: Verify presigned_urls.json
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          presigned_file="$WORKSPACE/presigned_urls.json"
          build_key="${MACHINE}_build.tar.gz"

          if [ ! -f "$presigned_file" ]; then
            echo "::error::presigned_urls.json not found"
            ls -la "$WORKSPACE"
            exit 1
          fi

          if [ ! -s "$presigned_file" ]; then
            echo "::error::presigned_urls.json is empty"
            exit 1
          fi

          jq empty "$presigned_file"

          echo "=== presigned_urls.json keys ==="
          jq -r 'keys[]' "$presigned_file"

          build_url="$(
            jq -r --arg key "$build_key" '.[$key] // empty' "$presigned_file"
          )"

          if [ -z "$build_url" ]; then
            echo "::error::Compressed combined build archive URL is missing"
            echo "::error::Expected key: $build_key"
            exit 1
          fi

          echo "presigned_urls.json verified"
          echo "Build key: $build_key"
          echo "Build URL: $build_url"

      - name: Clone LAVA job render scripts
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$GITHUB_WORKSPACE")"
          job_render_dir="$parent_dir/job_render"

          rm -rf "$job_render_dir"

          git clone \
            --depth 1 \
            -b testing_original_job_render \
            https://github.com/Manigurr/job_render \
            "$job_render_dir"

          echo "job_render cloned"
          echo "job_render commit: $(git -C "$job_render_dir" rev-parse HEAD)"
          echo "job_render branch: $(git -C "$job_render_dir" branch --show-current)"

          sed -n '1,160p' \
            "$job_render_dir/templates/boot/flasher.jinja2" || true

      - name: Verify job_render template
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$GITHUB_WORKSPACE")"
          template="$parent_dir/job_render/templates/boot/flasher.jinja2"

          if [ ! -f "$template" ]; then
            echo "::error::Missing flasher template: $template"
            exit 1
          fi

          echo "=== Active flasher template ==="
          sed -n '1,240p' "$template"

          if grep -Fq "grep -Rni" "$template"; then
            echo "::error::Unsafe diagnostic grep command remains in flasher.jinja2"
            grep -n "grep -Rni" "$template"
            exit 1
          fi

          if grep -Fq "label=" "$template"; then
            echo "::error::Manual rawprogram label patch must not be present"
            grep -n "label=" "$template"
            exit 1
          fi

          echo "flasher.jinja2 validation passed"

      - name: Verify job_render path
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$GITHUB_WORKSPACE")"
          job_render_dir="$parent_dir/job_render"

          test -d "$job_render_dir"
          test -f "$job_render_dir/lava_Job_definition_generator.py"
          test -d "$job_render_dir/templates"
          test -f "$job_render_dir/templates/boot/flasher.jinja2"

          echo "job_render path verified: $job_render_dir"

      - name: Render LAVA job definition
        if: ${{ matrix.build_matrix.lavaname != '' }}
        uses: qualcomm-linux-stg/video-driver/.github/actions/lava_job_render@kodiak_testing
        with:
          docker_image: ${{ inputs.docker_image }}
          machine: ${{ matrix.build_matrix.machine }}
          lavaname: ${{ matrix.build_matrix.lavaname }}
          presigned_urls_file: ${{ github.workspace }}/presigned_urls.json

      - name: Verify rendered LAVA job
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$WORKSPACE")"
          job_file="$parent_dir/job_render/renders/lava_job_definition.yaml"

          if [ ! -f "$job_file" ]; then
            echo "::error::Rendered LAVA job not found: $job_file"
            find "$parent_dir/job_render" -maxdepth 8 -type f -print | sort || true
            exit 1
          fi

          if [ ! -s "$job_file" ]; then
            echo "::error::Rendered LAVA job is empty: $job_file"
            exit 1
          fi

          echo "=== Rendered LAVA job ==="
          sed -n '1,300p' "$job_file"

      - name: Verify rendered LAVA job configuration
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          parent_dir="$(dirname "$WORKSPACE")"
          job_file="$parent_dir/job_render/renders/lava_job_definition.yaml"

          if [ ! -f "$job_file" ]; then
            echo "::error::Rendered LAVA job not found: $job_file"
            exit 1
          fi

          if ! grep -q '^device_type:' "$job_file"; then
            echo "::error::device_type is missing from rendered LAVA job"
            exit 1
          fi

          if ! grep -qE 'url:.*_build\.tar\.gz' "$job_file"; then
            echo "::error::Compressed combined build archive (_build.tar.gz) URL is missing"
            exit 1
          fi

          if grep -qE 'url:.*_build\.tar([[:space:]]|$)' "$job_file"; then
            echo "::error::Uncompressed combined build archive (_build.tar) URL must not be used"
            grep -nE 'url:.*_build\.tar' "$job_file" || true
            exit 1
          fi

          if grep -qE 'url:.*rootfs\.img' "$job_file"; then
            echo "::error::rootfs.img must not appear as a separate download URL"
            exit 1
          fi

          if grep -qE "url:[[:space:]]*['\"]?[[:space:]]*['\"]?$" "$job_file"; then
            echo "::error::Empty URL found in rendered LAVA job"
            grep -n "url:" "$job_file" || true
            exit 1
          fi

          if ! grep -q 'OVERLAY=overlay.tar.gz' "$job_file"; then
            echo "::error::OVERLAY setting is missing"
            exit 1
          fi

          if ! grep -q 'OVERLAY_PATH=/' "$job_file"; then
            echo "::error::OVERLAY_PATH setting is missing"
            exit 1
          fi

          if ! grep -q 'downloads://overlay.tar.gz' "$job_file"; then
            echo "::error::overlay.tar.gz deploy image is missing"
            exit 1
          fi

          if ! grep -q 'Test_binaries.tar.gz' "$job_file"; then
            echo "::error::Test_binaries.tar.gz is missing"
            exit 1
          fi

          echo "Rendered LAVA job configuration verified"

      - name: Verify LAVA Docker environment
        if: ${{ matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          docker image inspect "$DOCKER_IMAGE" >/dev/null

          docker run --rm "$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail
              command -v lavacli
              lavacli --version
              getent hosts lava-oss.qualcomm.com
            '

      - name: Submit LAVA job
        if: ${{ matrix.build_matrix.lavaname != '' }}
        id: submit_job
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          if [ -z "${LAVA_OSS_TOKEN:-}" ]; then
            echo "::error::LAVA_OSS_TOKEN is unavailable"
            exit 1
          fi

          if [ -z "${LAVA_OSS_USER:-}" ]; then
            echo "::error::LAVA_OSS_USER is unavailable"
            exit 1
          fi

          parent_dir="$(dirname "$WORKSPACE")"
          job_render_dir="$parent_dir/job_render"
          job_file="$job_render_dir/renders/lava_job_definition.yaml"
          submission_log="$WORKSPACE/lava-submit-output.txt"

          if [ ! -f "$job_file" ]; then
            echo "::error::LAVA job file not found: $job_file"
            exit 1
          fi

          set +e

          docker run -i --rm \
            --workdir="$job_render_dir" \
            --mount "type=bind,src=$parent_dir,dst=$parent_dir" \
            -e LAVA_OSS_TOKEN \
            -e LAVA_OSS_USER \
            "$DOCKER_IMAGE" \
            bash -c '
              set -euo pipefail

              lavacli identities add \
                --token "$LAVA_OSS_TOKEN" \
                --uri https://lava-oss.qualcomm.com/RPC2 \
                --username "$LAVA_OSS_USER" \
                production

              lavacli -i production jobs submit \
                ./renders/lava_job_definition.yaml
            ' 2>&1 | tee "$submission_log"

          docker_status="${PIPESTATUS[0]}"

          set -e

          if [ "$docker_status" -ne 0 ]; then
            echo "::error::LAVA submission failed with exit code $docker_status"
            cat "$submission_log"
            exit "$docker_status"
          fi

          job_id="$(
            grep -Eio \
              '(job[[:space:]]+)?([0-9]{4,})' \
              "$submission_log" |
              grep -Eo '[0-9]{4,}' |
              tail -n 1 |
              tr -d '[:space:]'
          )"

          if ! [[ "$job_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to extract a numeric LAVA job ID"
            cat "$submission_log"
            exit 1
          fi

          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"

          echo "JOB_ID=$job_id" >> "$GITHUB_ENV"
          echo "JOB_URL=$job_url" >> "$GITHUB_ENV"

          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "job_url=$job_url" >> "$GITHUB_OUTPUT"

          echo "LAVA job submitted: $job_id"
          echo "LAVA job URL: $job_url"

          {
            echo "### LAVA Job Submitted"
            echo
            echo "- Machine: \`$MACHINE\`"
            echo "- Job ID: [$job_id]($job_url)"
            echo "- Job URL: $job_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Poll LAVA job and validate all testcases
        if: ${{ success() && matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          LAVA_OSS_TOKEN: ${{ secrets.LAVA_OSS_TOKEN }}
          LAVA_OSS_USER: ${{ secrets.LAVA_OSS_USER }}
          JOB_ID: ${{ steps.submit_job.outputs.job_id }}
          JOB_URL: ${{ steps.submit_job.outputs.job_url }}
          WORKSPACE: ${{ github.workspace }}
          MACHINE: ${{ matrix.build_matrix.machine }}
        run: |
          set -euo pipefail

          echo "LAVA polling implementation: jobs-show-v1"

          if ! [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid LAVA job ID: $JOB_ID"
            exit 1
          fi

          poll_interval=30
          max_polls=240
          poll_count=0
          job_finished=false

          status_log="$WORKSPACE/lava-status-${JOB_ID}.txt"
          job_log="$WORKSPACE/lava-job-${JOB_ID}.log"
          testcase_results="$WORKSPACE/lava-testcase-results-${JOB_ID}.txt"

          : > "$status_log"
          : > "$job_log"
          : > "$testcase_results"

          echo "Polling LAVA job: $JOB_ID"
          echo "LAVA URL: ${JOB_URL:-https://lava-oss.qualcomm.com/scheduler/job/$JOB_ID}"
          echo "Polling interval: ${poll_interval}s"
          echo "Maximum polling attempts: $max_polls"
          echo "Maximum wait time: $((poll_interval * max_polls / 60)) minutes"

          while [ "$poll_count" -lt "$max_polls" ]; do
            poll_count=$((poll_count + 1))

            echo
            echo "============================================================"
            echo "LAVA status poll $poll_count/$max_polls"
            echo "============================================================"

            set +e

            lava_status="$(
              timeout --signal=TERM --kill-after=10s 90s \
                docker run --rm \
                  -e LAVA_OSS_TOKEN \
                  -e LAVA_OSS_USER \
                  "$DOCKER_IMAGE" \
                  bash -c '
                    set -euo pipefail

                    lavacli identities add \
                      --token "$LAVA_OSS_TOKEN" \
                      --uri https://lava-oss.qualcomm.com/RPC2 \
                      --username "$LAVA_OSS_USER" \
                      production

                    lavacli -i production jobs show "$1"
                  ' bash "$JOB_ID" 2>&1
            )"

            status_rc=$?

            set -e

            {
              echo
              echo "===== Status poll $poll_count - $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
              printf '%s\n' "$lava_status"
            } | tee -a "$status_log"

            if [ "$status_rc" -eq 124 ] || [ "$status_rc" -eq 137 ]; then
              echo "::warning::LAVA status request timed out; retrying"
              sleep "$poll_interval"
              continue
            fi

            if [ "$status_rc" -ne 0 ]; then
              echo "::error::Unable to retrieve LAVA job status"
              echo "::error::lavacli exit code: $status_rc"
              printf '%s\n' "$lava_status"
              exit 1
            fi

            if [ -z "$lava_status" ]; then
              echo "::warning::LAVA returned an empty status response; retrying"
              sleep "$poll_interval"
              continue
            fi

            echo "=== LAVA job status ==="
            printf '%s\n' "$lava_status"

            if printf '%s\n' "$lava_status" |
              grep -Eiq \
                'job[[:space:]]+finished[[:space:]]+correctly|finished[[:space:]]+correctly|status[[:space:]]*:[[:space:]]*(complete|completed|finished|failed|incomplete|cancelled|canceled|aborted|timeout|timed[[:space:]]+out)|state[[:space:]]*:[[:space:]]*(complete|completed|finished|failed|incomplete|cancelled|canceled|aborted|timeout|timed[[:space:]]+out)'
            then
              echo "LAVA job reached a terminal state"
              job_finished=true
              break
            fi

            if printf '%s\n' "$lava_status" |
              grep -Eiq \
                'job[[:space:]]+(failed|aborted|cancelled|canceled|timeout|timed[[:space:]]+out)|job[[:space:]]+finished[[:space:]]+incorrectly'
            then
              echo "::error::LAVA reported a failed, aborted, cancelled, or timed-out job"
              job_finished=true
              break
            fi

            echo "LAVA job is still running"
            sleep "$poll_interval"
          done

          if [ "$job_finished" != true ]; then
            echo "::error::LAVA job did not complete within the polling timeout"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "Fetching final LAVA logs"
          echo "============================================================"

          set +e

          final_lava_log="$(
            timeout --signal=TERM --kill-after=10s 120s \
              docker run --rm \
                -e LAVA_OSS_TOKEN \
                -e LAVA_OSS_USER \
                "$DOCKER_IMAGE" \
                bash -c '
                  set -euo pipefail

                  lavacli identities add \
                    --token "$LAVA_OSS_TOKEN" \
                    --uri https://lava-oss.qualcomm.com/RPC2 \
                    --username "$LAVA_OSS_USER" \
                    production

                  lavacli -i production jobs logs "$1"
                ' bash "$JOB_ID" 2>&1
          )"

          logs_rc=$?

          set -e

          if [ "$logs_rc" -eq 124 ] || [ "$logs_rc" -eq 137 ]; then
            echo "::error::Timed out while fetching final LAVA logs"
            exit 1
          fi

          if [ "$logs_rc" -ne 0 ]; then
            echo "::error::Unable to retrieve final LAVA logs"
            echo "::error::lavacli exit code: $logs_rc"
            printf '%s\n' "$final_lava_log"
            exit 1
          fi

          if [ -z "$final_lava_log" ]; then
            echo "::error::Final LAVA log is empty"
            echo "=== LAVA status response ==="
            cat "$status_log" || true
            exit 1
          fi

          printf '%s\n' "$final_lava_log" > "$job_log"

          echo
          echo "============================================================"
          echo "Extracting testcase results"
          echo "============================================================"

          grep -Eo \
            'TEST_CASE_ID=[^[:space:]>"]+[[:space:]]+RESULT=[^[:space:]>"]+' \
            "$job_log" |
            sed -E \
              's/.*TEST_CASE_ID=([^[:space:]>"]+)[[:space:]]+RESULT=([^[:space:]>"]+).*/\1\t\2/' |
            sort -u > "$testcase_results" || true

          if [ ! -s "$testcase_results" ]; then
            echo "::error::No LAVA testcase results were found"
            tail -n 200 "$job_log" || true
            exit 1
          fi

          echo "=== Testcase results ==="
          cat "$testcase_results"

          testcase_count=0
          passed_count=0
          failed_count=0

          while IFS="$(printf '\t')" read -r testcase_id testcase_result; do
            [ -n "$testcase_id" ] || continue

            testcase_count=$((testcase_count + 1))

            normalized_result="$(
              printf '%s' "$testcase_result" |
                tr '[:upper:]' '[:lower:]' |
                tr -d '[:space:]_-'
            )"

            if [ "$normalized_result" = "pass" ] ||
              [ "$normalized_result" = "passed" ]
            then
              passed_count=$((passed_count + 1))
              echo "PASS: $testcase_id"
            else
              failed_count=$((failed_count + 1))
              echo "FAIL: $testcase_id -> $testcase_result"
            fi
          done < "$testcase_results"

          echo
          echo "============================================================"
          echo "LAVA testcase summary"
          echo "============================================================"
          echo "Machine : $MACHINE"
          echo "Job ID  : $JOB_ID"
          echo "Total   : $testcase_count"
          echo "Passed  : $passed_count"
          echo "Failed  : $failed_count"

          {
            echo "### LAVA Test Result"
            echo
            echo "- Machine: \`$MACHINE\`"
            echo "- Job ID: [$JOB_ID](${JOB_URL:-https://lava-oss.qualcomm.com/scheduler/job/$JOB_ID})"
            echo "- Total testcases: \`$testcase_count\`"
            echo "- Passed: \`$passed_count\`"
            echo "- Failed: \`$failed_count\`"
            echo
            echo "#### Testcase Results"
            echo

            while IFS="$(printf '\t')" read -r testcase_id testcase_result; do
              [ -n "$testcase_id" ] || continue
              echo "- \`$testcase_id\`: \`$testcase_result\`"
            done < "$testcase_results"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$testcase_count" -eq 0 ]; then
            echo "::error::No testcases were detected"
            exit 1
          fi

          if [ "$failed_count" -ne 0 ]; then
            echo "::error::$failed_count LAVA testcase(s) failed"
            exit 1
          fi

          if [ "$passed_count" -ne "$testcase_count" ]; then
            echo "::error::Not all LAVA testcases passed"
            exit 1
          fi

          echo "All $testcase_count LAVA testcases passed"

      - name: Upload LAVA logs
        if: ${{ always() && matrix.build_matrix.lavaname != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lava-results-${{ matrix.build_matrix.machine }}
          path: |
            ${{ github.workspace }}/lava-submit-output.txt
            ${{ github.workspace }}/lava-status-*.txt
            ${{ github.workspace }}/lava-job-*.log
            ${{ github.workspace }}/lava-testcase-results-*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Save job ID
        if: ${{ always() && matrix.build_matrix.lavaname != '' }}
        shell: bash
        env:
          MACHINE: ${{ matrix.build_matrix.machine }}
          JOB_ID: ${{ env.JOB_ID }}
          JOB_URL: ${{ env.JOB_URL }}
        run: |
          set -euo pipefail

          job_id="${JOB_ID:-unknown}"
          job_url="${JOB_URL:-}"

          echo "Machine  : $MACHINE"
          echo "Job ID   : $job_id"
          echo "Job URL  : ${job_url:-N/A}"

          if [ "$job_id" = "unknown" ]; then
            echo "::warning::No LAVA job ID recorded for machine: $MACHINE"
          fi

          {
            echo "### LAVA Job Summary"
            echo
            echo "- Machine: \`$MACHINE\`"

            if [ -n "$job_url" ]; then
              echo "- Job ID: [$job_id]($job_url)"
              echo "- Job URL: $job_url"
            else
              echo "- Job ID: \`$job_id\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"