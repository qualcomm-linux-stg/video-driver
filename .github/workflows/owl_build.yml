name: owl_build

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      branch:
        description: Kernel repository branch
        type: string
        required: false
        default: meta-qcom

      repo:
        description: Kernel repository URL
        type: string
        required: true

jobs:
  build:
    name: Build kernel and video driver

    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels:
        - self-hosted
        - video-stg-u2204-x64-large-od-ephem

    timeout-minutes: 720

    outputs:
      kernel_version: ${{ steps.build_workspace.outputs.kernel_version }}

    steps:
      - name: Checkout video-driver code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: video-driver
          repository: qualcomm-linux-stg/video-driver
          ref: meta-qcom

      - name: Clone kernel repository
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          echo "Repository: ${REPOSITORY}"
          echo "Branch: ${BRANCH}"

          if [[ -z "${REPOSITORY}" ]]; then
            echo "ERROR: The 'repo' workflow input is empty."
            exit 1
          fi

          if [[ -z "${BRANCH}" ]]; then
            echo "ERROR: The 'branch' workflow input is empty."
            exit 1
          fi

          rm -rf kernel

          git clone \
            --branch "${BRANCH}" \
            --single-branch \
            "${REPOSITORY}" \
            kernel

          echo "Kernel repository cloned successfully."
          git -C kernel status --short --branch
          git -C kernel log -1 --oneline

      - name: Show directories after code sync
        shell: bash
        run: |
          set -euo pipefail

          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "Current directory:"
          pwd

          echo "Workspace contents:"
          ls -al

          echo "video-driver contents:"
          ls -al video-driver

          echo "kernel contents:"
          ls -al kernel

      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Add swap space
        shell: bash
        run: |
          set -euo pipefail

          if sudo swapon --show | grep -q '/swapfile'; then
            echo "Swap is already enabled."
          else
            if [[ ! -f /swapfile ]]; then
              echo "Creating 16 GB swap file..."
              sudo fallocate -l 16G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi

            sudo swapon /swapfile
            echo "Swap enabled."
          fi

          echo "=== Memory information ==="
          free -h

          echo "=== Swap information ==="
          sudo swapon --show

      - name: Retag Docker image
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          DOCKER_REGISTRY: artifacts.codelinaro.org/clo-420-qli-registry
        run: |
          set -euo pipefail

          SOURCE_IMAGE="${DOCKER_REGISTRY}/${DOCKER_IMAGE}"
          TARGET_IMAGE="${DOCKER_IMAGE}"

          echo "Source Docker image: ${SOURCE_IMAGE}"
          echo "Target Docker image: ${TARGET_IMAGE}"

          if docker image inspect "${TARGET_IMAGE}" >/dev/null 2>&1; then
            echo "Docker image already exists locally: ${TARGET_IMAGE}"
          elif docker image inspect "${SOURCE_IMAGE}" >/dev/null 2>&1; then
            docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
            echo "Docker image retagged successfully."
          else
            echo "ERROR: Docker image was not found."
            echo "Checked:"
            echo "  ${SOURCE_IMAGE}"
            echo "  ${TARGET_IMAGE}"
            exit 1
          fi

          docker image inspect "${TARGET_IMAGE}"

      - name: Build workspace
        id: build_workspace
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          echo "Workspace: ${PWD}"
          ls -al

          docker run -i --rm \
            --user "$(id -u):$(id -g)" \
            --workdir="${PWD}" \
            -v "$(dirname "${PWD}")":"$(dirname "${PWD}")" \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail

              echo "Container workspace: ${PWD}"
              ls -al

              if [[ ! -d kernel ]]; then
                echo "ERROR: kernel directory does not exist."
                exit 1
              fi

              if [[ ! -d video-driver ]]; then
                echo "ERROR: video-driver directory does not exist."
                exit 1
              fi

              echo "=== Kernel repository ==="
              git -C kernel status --short --branch || true
              git -C kernel log -1 --oneline || true

              echo "=== Video-driver repository ==="
              git -C video-driver status --short --branch || true
              git -C video-driver log -1 --oneline || true

              echo "=== Kernel defconfig ==="
              make -C kernel defconfig

              echo "=== Kernel build ==="
              make -C kernel -j"$(nproc)"

              echo "=== Verify kernel build artifacts ==="
              test -f kernel/vmlinux
              test -f kernel/Module.symvers

              ls -lh \
                kernel/vmlinux \
                kernel/Module.symvers

              echo "=== Kernel version ==="
              make -s -C kernel kernelrelease | tee kernel_version.txt

              echo "=== Build video-driver out-of-tree modules ==="
              make -C video-driver \
                modules \
                KERNEL_SRC="${PWD}/kernel" \
                -j"$(nproc)"

              echo "=== Build completed successfully ==="
            '

          if [[ ! -f kernel/kernel_version.txt ]]; then
            echo "ERROR: kernel_version.txt was not generated."
            exit 1
          fi

          KERNEL_VERSION="$(tr -d '[:space:]' < kernel/kernel_version.txt)"

          if [[ -z "${KERNEL_VERSION}" ]]; then
            echo "ERROR: Kernel version is empty."
            exit 1
          fi

          echo "kernel_version=${KERNEL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Kernel version: ${KERNEL_VERSION}"

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Kernel build outputs ==="
          test -f kernel/vmlinux
          test -f kernel/Module.symvers
          test -f kernel/kernel_version.txt

          ls -lh \
            kernel/vmlinux \
            kernel/Module.symvers \
            kernel/kernel_version.txt

          echo "=== Video-driver build outputs ==="
          find video-driver \
            -type f \
            \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.zst' \) \
            -print

          echo "Build verification completed successfully."