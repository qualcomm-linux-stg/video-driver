name: owl_build

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      branch:
        description: Kernel repository branch
        type: string
        required: false
        default: meta-qcom

      repo:
        description: Kernel repository URL or owner/repository
        type: string
        required: true

jobs:
  build:
    name: Build kernel and video driver

    runs-on:
      group: GHA-video-Stg-SelfHosted-RG
      labels:
        - self-hosted
        - video-stg-u2204-x64-large-od-ephem

    timeout-minutes: 720

    outputs:
      kernel_version: ${{ steps.build_workspace.outputs.kernel_version }}

    steps:
      - name: Checkout video-driver code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: video-driver
          repository: qualcomm-linux-stg/video-driver
          ref: meta-qcom

      - name: Clone kernel repository
        name: Clone kernel repository
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          echo "Repository: ${REPOSITORY}"
          echo "Branch: ${BRANCH}"

          if [[ -z "${REPOSITORY}" ]]; then
            echo "ERROR: The 'repo' workflow input is empty."
            exit 1
          fi

          if [[ -z "${BRANCH}" ]]; then
            echo "ERROR: The 'branch' workflow input is empty."
            exit 1
          fi

          rm -rf kernel

          git clone \
            --branch "${BRANCH}" \
            --single-branch \
            "${REPOSITORY}" \
            kernel

          echo "Kernel repository cloned successfully."
          git -C kernel status --short --branch
          git -C kernel log -1 --oneline

      - name: Show directories after code sync
        shell: bash
        run: |
          set -euo pipefail

          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "Current directory:"
          pwd

          echo "Workspace contents:"
          ls -al

          echo "video-driver contents:"
          ls -al video-driver

          echo "kernel contents:"
          ls -al kernel

      - name: Pull Docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: artifacts.codelinaro.org/clo-420-qli-registry

      - name: Add swap space
        shell: bash
        run: |
          set -euo pipefail

          if sudo swapon --show | grep -q '/swapfile'; then
            echo "Swap is already enabled."
          else
            if [[ ! -f /swapfile ]]; then
              echo "Creating 16 GB swap file..."
              sudo fallocate -l 16G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi

            sudo swapon /swapfile
            echo "Swap enabled."
          fi

          echo "=== Memory information ==="
          free -h

          echo "=== Swap information ==="
          sudo swapon --show

      - name: Retag Docker image
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          REGISTRY: artifacts.codelinaro.org/clo-420-qli-registry
        run: |
          set -euo pipefail

          SOURCE_IMAGE="${REGISTRY}/${DOCKER_IMAGE}"
          TARGET_IMAGE="${DOCKER_IMAGE}"

          echo "Source image: ${SOURCE_IMAGE}"
          echo "Target image: ${TARGET_IMAGE}"

          if docker image inspect "${SOURCE_IMAGE}" >/dev/null 2>&1; then
            docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
            echo "Docker image retagged successfully."
          elif docker image inspect "${TARGET_IMAGE}" >/dev/null 2>&1; then
            echo "Target Docker image already exists locally."
          else
            echo "ERROR: Docker image was not found:"
            echo "  ${SOURCE_IMAGE}"
            echo "  ${TARGET_IMAGE}"
            docker images
            exit 1
          fi

          docker image inspect "${TARGET_IMAGE}"

      - name: Build workspace
        id: build_workspace
        shell: bash
        env:
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          set -euo pipefail

          echo "Host workspace: ${PWD}"
          ls -al

          docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            --workdir "${PWD}" \
            -v "$(dirname "${PWD}"):$(dirname "${PWD}")" \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -euo pipefail

              echo "Container workspace: ${PWD}"
              ls -al

              echo "=== Kernel source ==="
              ls -al kernel

              echo "=== Video-driver source ==="
              ls -al video-driver

              echo "=== Kernel defconfig ==="
              make -C kernel defconfig

              echo "=== Full kernel build ==="
              echo "Using $(nproc) parallel jobs."
              make -C kernel -j"$(nproc)"

              echo "=== Verify kernel build outputs ==="
              test -f kernel/vmlinux
              test -f kernel/Module.symvers

              ls -lh kernel/vmlinux
              ls -lh kernel/Module.symvers

              echo "=== Build video-driver out-of-tree modules ==="
              make -C video-driver \
                modules \
                KERNEL_SRC="${PWD}/kernel" \
                -j"$(nproc)"

              echo "Kernel and video-driver builds completed successfully."
            '

          KERNEL_VERSION="$(make -s -C kernel kernelversion)"

          if [[ -z "${KERNEL_VERSION}" ]]; then
            echo "ERROR: Kernel version is empty."
            exit 1
          fi

          echo "Kernel version: ${KERNEL_VERSION}"
          echo "kernel_version=${KERNEL_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "Build completed successfully."
          echo "Kernel version: ${{ steps.build_workspace.outputs.kernel_version }}"
          echo "Kernel source: ${GITHUB_WORKSPACE}/kernel"
          echo "Video-driver source: ${GITHUB_WORKSPACE}/video-driver"