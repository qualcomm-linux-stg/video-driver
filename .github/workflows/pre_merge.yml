name: pre_merge

run-name: Pre Merge Workflow

on:
  workflow_dispatch:

  push:
    branches:
      - meta-qcom

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - meta-qcom

permissions:
  contents: read
  actions: write

jobs:
  loading:
    name: Load build configuration
    uses: ./.github/workflows/loading.yml
    with:
      event_name: ${{ github.event_name }}
    # Do not use secrets: inherit unless loading.yml really needs secrets.
    # Fork PRs cannot access protected repository secrets.

  build:
    name: Build
    needs:
      - loading
    uses: ./.github/workflows/sync-and-build.yml
    with:
      build_matrix: ${{ needs.loading.outputs.build_matrix }}
      docker_image: kmake-image:ver.1.0
      commit_sha: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha
            || github.sha }}
    # Do not use secrets: inherit for fork-safe builds.