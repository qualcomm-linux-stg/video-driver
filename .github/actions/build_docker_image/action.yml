name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true

  kas_file:
    description: KAS file to use for the build job
    required: true

  build_command:
    description: Command to run for the build
    required: false
    default: bitbake core-image-base

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.docker_image }}
        KAS_FILE: ${{ inputs.kas_file }}
        BUILD_COMMAND: ${{ inputs.build_command }}
        MACHINE: ${{ env.machine }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail

        USER_ID="$(id -u)"
        GROUP_ID="$(id -g)"

        WORKSPACE_ROOT="$(dirname "$WORKSPACE")"
        REPO_NAME="$(basename "$WORKSPACE")"

        echo "Machine: $MACHINE"
        echo "Docker image: $DOCKER_IMAGE"
        echo "KAS file: $KAS_FILE"
        echo "Build command: $BUILD_COMMAND"
        echo "WORKSPACE_ROOT: $WORKSPACE_ROOT"
        echo "REPO_NAME: $REPO_NAME"

        KAS_CONF_FILE="$WORKSPACE_ROOT/kas_local_conf_header.txt"

        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "$KAS_CONF_FILE"

        if [ ! -s "$KAS_CONF_FILE" ]; then
          echo "::error::KAS_LOCAL_CONF_HEADER is empty"
          exit 1
        fi

        echo "KAS_LOCAL_CONF_HEADER written to host file"

        docker run --rm \
          --user "$USER_ID:$GROUP_ID" \
          -v "$WORKSPACE_ROOT:/workspace" \
          -w "/workspace/$REPO_NAME" \
          -e "MACHINE=$MACHINE" \
          -e "KAS_FILE=$KAS_FILE" \
          -e "BUILD_COMMAND=$BUILD_COMMAND" \
          "$DOCKER_IMAGE" \
          bash -lc '
            set -euo pipefail

            KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"

            if [ ! -s "$KAS_CONF_FILE" ]; then
              echo "KAS configuration file is missing or empty:"
              echo "$KAS_CONF_FILE"
              exit 1
            fi

            export KAS_LOCAL_CONF_HEADER="$(cat "$KAS_CONF_FILE")"

            echo "=== Inside container ==="
            echo "Working directory: $(pwd)"
            echo "Machine: $MACHINE"
            echo "KAS file: $KAS_FILE"
            echo "Build command: $BUILD_COMMAND"

            echo "=== Workspace ==="
            ls -la /workspace

            echo "=== Repository ==="
            ls -la .

            echo "=== meta-qcom/ci ==="
            ls -la ../meta-qcom/ci || true

            echo "=== KAS_LOCAL_CONF_HEADER preview ==="
            printf "%s\n" "$KAS_LOCAL_CONF_HEADER" | head -n 5

            which kas
            kas --version

            kas shell -c "$BUILD_COMMAND" "$KAS_FILE"

            echo "=== local.conf EXTERNALSRC lines ==="

            LOCAL_CONF="/workspace/video-driver/build/conf/local.conf"

            if [ -f "$LOCAL_CONF" ]; then
              grep -n \
                -E "EXTERNALSRC|iris-video-dlkm|do_fetch|do_patch" \
                "$LOCAL_CONF" || {
                  echo "No EXTERNALSRC entries found"
                  exit 1
                }
            else
              echo "local.conf not found: $LOCAL_CONF"
              exit 1
            fi
          '