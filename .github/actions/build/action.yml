name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        # ------------------------------------------------------------------ #
        #  Write KAS_LOCAL_CONF_HEADER to a file mounted into Docker.        #
        #  kas checkout / kas shell -c do NOT process KAS_LOCAL_CONF_HEADER. #
        #  We manually append it to local.conf after kas checkout runs.      #
        # ------------------------------------------------------------------ #
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"
        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "${KAS_CONF_FILE}"

        echo "=== KAS_LOCAL_CONF_HEADER written to HOST file ==="
        cat "${KAS_CONF_FILE}"
        echo "==================================================="

        # ✅ Fail immediately if header file is empty
        if [ ! -s "${KAS_CONF_FILE}" ]; then
          echo "❌ KAS_LOCAL_CONF_HEADER is EMPTY — EXTERNALSRC override will not apply!"
          exit 1
        fi

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          "${{ inputs.docker_image }}" \
          bash -lc '
            set -euo pipefail

            # ✅ Load KAS_LOCAL_CONF_HEADER from mounted file
            KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"
            if [ -f "${KAS_CONF_FILE}" ] && [ -s "${KAS_CONF_FILE}" ]; then
              export KAS_LOCAL_CONF_HEADER="$(cat "${KAS_CONF_FILE}")"
              echo "✅ KAS_LOCAL_CONF_HEADER loaded from file inside Docker"
            else
              echo "❌ KAS_LOCAL_CONF_HEADER file missing or empty: ${KAS_CONF_FILE}"
              exit 1
            fi

            echo "=== inside container ==="
            echo "pwd: $(pwd)"
            echo "=== /workspace ==="
            ls -la /workspace
            echo "=== /workspace/video-driver ==="
            ls -la .
            echo "=== /workspace/meta-qcom/ci ==="
            ls -la ../meta-qcom/ci || true

            # ✅ Confirm KAS_LOCAL_CONF_HEADER content
            echo "=== KAS_LOCAL_CONF_HEADER inside Docker (first 5 lines) ==="
            echo "${KAS_LOCAL_CONF_HEADER}" | head -5
            echo "============================================================"

            # ✅ Confirm PR file is present inside Docker
            echo "=== Lines 1157-1165 of msm_vidc_probe.c (DOCKER) ==="
            sed -n '"'"'1157,1165p'"'"' driver/vidc/src/msm_vidc_probe.c || \
              echo "⚠️  File not found"
            echo "======================================================"

            echo "Starting build for ${MACHINE}"
            echo "Using kas file: ${KAS_FILE}"
            echo "Running build command: ${BUILD_COMMAND}"
            which kas
            kas --version

            # ------------------------------------------------------------------ #
            #  Step 1: kas checkout — sets up layers and writes local.conf       #
            #  KAS_LOCAL_CONF_HEADER is NOT processed by kas checkout alone.     #
            #  We manually append it to local.conf immediately after.            #
            # ------------------------------------------------------------------ #
            echo "=== Step 1: kas checkout ==="
            kas checkout "${KAS_FILE}"

            LOCAL_CONF="/workspace/video-driver/build/conf/local.conf"

            if [ ! -f "${LOCAL_CONF}" ]; then
              echo "❌ local.conf not found after kas checkout: ${LOCAL_CONF}"
              exit 1
            fi
            echo "✅ local.conf found after kas checkout"

            # ------------------------------------------------------------------ #
            #  Step 2: Manually append EXTERNALSRC overrides to local.conf       #
            #  This is the ONLY reliable way — kas checkout does not do it.      #
            # ------------------------------------------------------------------ #
            echo "=== Step 2: Appending KAS_LOCAL_CONF_HEADER to local.conf ==="
            echo "" >> "${LOCAL_CONF}"
            echo "${KAS_LOCAL_CONF_HEADER}" >> "${LOCAL_CONF}"
            echo "✅ KAS_LOCAL_CONF_HEADER appended to local.conf"

            # ✅ Verify EXTERNALSRC is now in local.conf
            echo "=== local.conf EXTERNALSRC lines (AFTER append) ==="
            grep -n "EXTERNALSRC\|iris-video-dlkm\|do_fetch\|do_patch\|BB_NUMBER" \
              "${LOCAL_CONF}" \
              || echo "❌ NO EXTERNALSRC FOUND — append failed!"
            echo "==================================================="

            # ✅ Fail early if EXTERNALSRC still missing
            if ! grep -q "EXTERNALSRC:pn-iris-video-dlkm" "${LOCAL_CONF}"; then
              echo "❌ EXTERNALSRC override missing from local.conf — cannot proceed!"
              exit 1
            fi
            echo "✅ EXTERNALSRC confirmed in local.conf"

            # ------------------------------------------------------------------ #
            #  Step 3: Run bitbake directly — local.conf already has overrides   #
            # ------------------------------------------------------------------ #
            echo "=== Step 3: Running bitbake directly ==="
            source /workspace/video-driver/build/conf/../../oe-core/oe-init-build-env \
              /workspace/video-driver/build 2>/dev/null || true
            cd /workspace/video-driver
            bash -c "source ../oe-core/oe-init-build-env build && ${BUILD_COMMAND}"
          '