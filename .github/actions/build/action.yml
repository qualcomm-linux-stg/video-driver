name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        # ✅ Confirm KAS_LOCAL_CONF_HEADER is set on host before passing into Docker
        echo "=== KAS_LOCAL_CONF_HEADER on host ==="
        echo "${KAS_LOCAL_CONF_HEADER:-<EMPTY — NOT SET>}" | head -5
        echo "====================================="

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          -e "KAS_LOCAL_CONF_HEADER=${KAS_LOCAL_CONF_HEADER:-}" \
          "${{ inputs.docker_image }}" \
          bash -lc '
            set -euo pipefail
            echo "=== inside container ==="
            echo "pwd: $(pwd)"
            echo "=== /workspace ==="
            ls -la /workspace
            echo "=== /workspace/video-driver ==="
            ls -la .
            echo "=== /workspace/meta-qcom/ci ==="
            ls -la ../meta-qcom/ci || true

            # ✅ Confirm KAS_LOCAL_CONF_HEADER reached inside Docker
            echo "=== KAS_LOCAL_CONF_HEADER inside Docker ==="
            echo "${KAS_LOCAL_CONF_HEADER:-<EMPTY — NOT SET>}" | head -5
            echo "==========================================="

            # ✅ Confirm PR file is present inside Docker
            echo "=== Lines 1158-1165 of msm_vidc_probe.c (DOCKER) ==="
            sed -n '"'"'1158,1165p'"'"' driver/vidc/src/msm_vidc_probe.c || \
              echo "⚠️  File not found"
            echo "====================================================="

            echo "Starting build for ${MACHINE}"
            echo "Using kas file: ${KAS_FILE}"
            echo "Running build command: ${BUILD_COMMAND}"
            which kas
            kas --version
            kas shell -c "${BUILD_COMMAND}" "${KAS_FILE}"

            # ✅ After kas init verify local.conf has EXTERNALSRC override
            echo "=== local.conf EXTERNALSRC lines ==="
            grep -n "EXTERNALSRC\|iris-video-dlkm\|do_fetch\|do_patch" \
              /workspace/video-driver/build/conf/local.conf \
              || echo "❌ NO EXTERNALSRC FOUND IN local.conf!"
            echo "====================================="
          '