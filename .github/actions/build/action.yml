name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        # ------------------------------------------------------------------ #
        #  Write KAS_LOCAL_CONF_HEADER to a file mounted into Docker.        #
        #  We manually append it to local.conf AFTER kas checkout,           #
        #  then source oe-init-build-env and run bitbake directly.           #
        #  kas shell re-runs checkout and overwrites local.conf — avoid it.  #
        # ------------------------------------------------------------------ #
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"
        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "${KAS_CONF_FILE}"

        echo "=== KAS_LOCAL_CONF_HEADER written to HOST file ==="
        cat "${KAS_CONF_FILE}"
        echo "==================================================="

        if [ ! -s "${KAS_CONF_FILE}" ]; then
          echo "❌ KAS_LOCAL_CONF_HEADER is EMPTY!"
          exit 1
        fi

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          "${{ inputs.docker_image }}" \
          bash -lc '
            set -euo pipefail

            # ✅ Load KAS_LOCAL_CONF_HEADER from mounted file
            KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"
            if [ -f "${KAS_CONF_FILE}" ] && [ -s "${KAS_CONF_FILE}" ]; then
              export KAS_LOCAL_CONF_HEADER="$(cat "${KAS_CONF_FILE}")"
              echo "✅ KAS_LOCAL_CONF_HEADER loaded from file inside Docker"
            else
              echo "❌ KAS_LOCAL_CONF_HEADER file missing or empty!"
              exit 1
            fi

            echo "=== inside container ==="
            echo "pwd: $(pwd)"
            echo "=== /workspace ==="
            ls -la /workspace

            echo "=== KAS_LOCAL_CONF_HEADER (first 5 lines) ==="
            echo "${KAS_LOCAL_CONF_HEADER}" | head -5
            echo "=============================================="

            # ✅ Confirm PR file inside Docker
            echo "=== Lines 1157-1165 msm_vidc_probe.c (DOCKER) ==="
            sed -n '"'"'1157,1165p'"'"' driver/vidc/src/msm_vidc_probe.c || \
              echo "⚠️ File not found"
            echo "=================================================="

            echo "Starting build for ${MACHINE}"
            echo "Using kas file: ${KAS_FILE}"
            echo "Running build command: ${BUILD_COMMAND}"
            which kas
            kas --version

            # ---------------------------------------------------------------- #
            #  Step 1: kas checkout — sets up layers + writes local.conf       #
            # ---------------------------------------------------------------- #
            echo "=== Step 1: kas checkout ==="
            kas checkout "${KAS_FILE}"

            # ---------------------------------------------------------------- #
            #  Step 2: Find local.conf and append EXTERNALSRC override         #
            #  Build dir is always /workspace/video-driver/build/conf/         #
            # ---------------------------------------------------------------- #
            LOCAL_CONF="/workspace/video-driver/build/conf/local.conf"

            if [ ! -f "${LOCAL_CONF}" ]; then
              echo "❌ local.conf not found at: ${LOCAL_CONF}"
              echo "Searching..."
              find /workspace -name "local.conf" 2>/dev/null || true
              exit 1
            fi

            echo "✅ local.conf found: ${LOCAL_CONF}"
            echo "=== Step 2: Appending KAS_LOCAL_CONF_HEADER to local.conf ==="
            printf "\n%s\n" "${KAS_LOCAL_CONF_HEADER}" >> "${LOCAL_CONF}"
            echo "✅ Appended successfully"

            echo "=== local.conf EXTERNALSRC lines ==="
            grep -n "EXTERNALSRC\|iris-video-dlkm\|do_fetch\|do_patch\|BB_NUMBER" \
              "${LOCAL_CONF}" \
              || echo "❌ NO EXTERNALSRC FOUND!"
            echo "====================================="

            # ---------------------------------------------------------------- #
            #  Step 3: Find and source oe-init-build-env                       #
            #  kas clones oe-core as sibling to meta-qcom → /workspace/oe-core #
            # ---------------------------------------------------------------- #
            echo "=== Step 3: Sourcing oe-init-build-env ==="

            # Find oe-init-build-env dynamically
            OE_INIT=$(find /workspace -maxdepth 3 -name "oe-init-build-env" \
              ! -path "*/video-driver/*" 2>/dev/null | head -1)

            if [ -z "${OE_INIT}" ]; then
              echo "Searching deeper..."
              OE_INIT=$(find /workspace -name "oe-init-build-env" 2>/dev/null | head -1)
            fi

            if [ -z "${OE_INIT}" ]; then
              echo "❌ oe-init-build-env not found anywhere in /workspace!"
              find /workspace -name "oe-init-build-env" 2>/dev/null || true
              exit 1
            fi

            echo "✅ Found oe-init-build-env at: ${OE_INIT}"
            OE_DIR=$(dirname "${OE_INIT}")

            # Source OE environment — sets up PATH for bitbake
            # Build dir is /workspace/video-driver/build
            cd "${OE_DIR}"
            source "${OE_INIT}" /workspace/video-driver/build
            cd /workspace/video-driver

            echo "✅ OE environment sourced"
            echo "bitbake path: $(which bitbake 2>/dev/null || echo NOT FOUND)"

            # ---------------------------------------------------------------- #
            #  Step 4: Run bitbake directly — uses our patched local.conf      #
            # ---------------------------------------------------------------- #
            echo "=== Step 4: Running bitbake ==="
            ${BUILD_COMMAND}
          '