name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        # ------------------------------------------------------------------ #
        #  Write KAS_LOCAL_CONF_HEADER to a file mounted into Docker.        #
        #  kas shell -c does NOT process KAS_LOCAL_CONF_HEADER.              #
        #  We use kas checkout (writes local.conf) then bitbake directly.    #
        # ------------------------------------------------------------------ #
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"
        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "${KAS_CONF_FILE}"

        echo "=== KAS_LOCAL_CONF_HEADER written to HOST file ==="
        cat "${KAS_CONF_FILE}"
        echo "==================================================="

        if [ ! -s "${KAS_CONF_FILE}" ]; then
          echo "❌ KAS_LOCAL_CONF_HEADER is EMPTY — EXTERNALSRC override will not apply!"
          exit 1
        fi

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          "${{ inputs.docker_image }}" \
          bash -lc '
            set -euo pipefail

            # ✅ Load KAS_LOCAL_CONF_HEADER from mounted file
            KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"
            if [ -f "${KAS_CONF_FILE}" ] && [ -s "${KAS_CONF_FILE}" ]; then
              export KAS_LOCAL_CONF_HEADER="$(cat "${KAS_CONF_FILE}")"
              echo "✅ KAS_LOCAL_CONF_HEADER loaded from file inside Docker"
            else
              echo "❌ KAS_LOCAL_CONF_HEADER file missing or empty: ${KAS_CONF_FILE}"
              exit 1
            fi

            echo "=== inside container ==="
            echo "pwd: $(pwd)"
            echo "=== /workspace ==="
            ls -la /workspace
            echo "=== /workspace/video-driver ==="
            ls -la .
            echo "=== /workspace/meta-qcom/ci ==="
            ls -la ../meta-qcom/ci || true

            # ✅ Confirm KAS_LOCAL_CONF_HEADER inside Docker
            echo "=== KAS_LOCAL_CONF_HEADER inside Docker (first 5 lines) ==="
            echo "${KAS_LOCAL_CONF_HEADER}" | head -5
            echo "============================================================"

            # ✅ Confirm PR file present inside Docker
            echo "=== Lines 1157-1165 of msm_vidc_probe.c (DOCKER) ==="
            sed -n '"'"'1157,1165p'"'"' driver/vidc/src/msm_vidc_probe.c || \
              echo "⚠️  File not found"
            echo "====================================================="

            echo "Starting build for ${MACHINE}"
            echo "Using kas file: ${KAS_FILE}"
            echo "Running build command: ${BUILD_COMMAND}"
            which kas
            kas --version

            # ---------------------------------------------------------------- #
            #  Step 1: kas checkout — initializes layers + writes local.conf   #
            #  KAS_LOCAL_CONF_HEADER is processed HERE and written to          #
            #  build/conf/local.conf BEFORE bitbake runs.                      #
            #  kas shell -c does NOT do this — that was the root cause.        #
            # ---------------------------------------------------------------- #
            echo "=== Step 1: kas checkout (writes local.conf) ==="
            kas checkout "${KAS_FILE}"

            # ✅ Verify local.conf has EXTERNALSRC BEFORE bitbake runs
            echo "=== local.conf EXTERNALSRC lines (BEFORE bitbake) ==="
            grep -n "EXTERNALSRC\|iris-video-dlkm\|do_fetch\|do_patch" \
              /workspace/video-driver/build/conf/local.conf \
              || echo "❌ NO EXTERNALSRC FOUND — override not applied!"
            echo "======================================================"

            # ✅ Fail immediately if EXTERNALSRC not in local.conf
            if ! grep -q "EXTERNALSRC:pn-iris-video-dlkm" \
              /workspace/video-driver/build/conf/local.conf 2>/dev/null; then
              echo "❌ EXTERNALSRC override missing from local.conf!"
              echo "   KAS_LOCAL_CONF_HEADER was not applied by kas checkout."
              exit 1
            fi
            echo "✅ EXTERNALSRC confirmed in local.conf — PR code will be built"

            # ---------------------------------------------------------------- #
            #  Step 2: source oe-init-build-env and run bitbake directly       #
            #  This is equivalent to kas shell -c but local.conf is already    #
            #  correctly set up by kas checkout above.                         #
            # ---------------------------------------------------------------- #
            echo "=== Step 2: sourcing oe-init-build-env and running bitbake ==="
            cd /workspace/video-driver
            source /workspace/oe-core/oe-init-build-env build
            echo "Running: ${BUILD_COMMAND}"
            ${BUILD_COMMAND}
          '