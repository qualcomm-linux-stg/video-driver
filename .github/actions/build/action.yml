name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        # ------------------------------------------------------------------ #
        #  Write KAS_LOCAL_CONF_HEADER to a mounted file.                    #
        #  Multiline env vars are silently truncated by docker run -e.       #
        # ------------------------------------------------------------------ #
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"
        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "${KAS_CONF_FILE}"

        echo "=== KAS_LOCAL_CONF_HEADER on HOST ==="
        cat "${KAS_CONF_FILE}"
        echo "====================================="

        if [ ! -s "${KAS_CONF_FILE}" ]; then
          echo "❌ KAS_LOCAL_CONF_HEADER is EMPTY!"
          exit 1
        fi

        # ------------------------------------------------------------------ #
        #  Write build script using python3 — NO heredoc (breaks YAML).     #
        #  Script runs inside Docker:                                        #
        #    1. kas checkout  → sets up layers + writes local.conf           #
        #    2. append header → injects EXTERNALSRC into local.conf          #
        #    3. kas shell -c  → sets up OE env + runs bitbake                #
        # ------------------------------------------------------------------ #
        BUILD_SCRIPT="${WORKSPACE_ROOT}/ci_build.sh"

        python3 - <<'PYEOF'
import os

script = r"""#!/bin/bash
set -euo pipefail

KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"
if [ -f "${KAS_CONF_FILE}" ] && [ -s "${KAS_CONF_FILE}" ]; then
  export KAS_LOCAL_CONF_HEADER="$(cat "${KAS_CONF_FILE}")"
  echo "✅ KAS_LOCAL_CONF_HEADER loaded from file inside Docker"
else
  echo "❌ KAS_LOCAL_CONF_HEADER file missing or empty!"
  exit 1
fi

echo "=== inside container ==="
echo "pwd: $(pwd)"
echo "=== KAS_LOCAL_CONF_HEADER (first 5 lines) ==="
echo "${KAS_LOCAL_CONF_HEADER}" | head -5
echo "=============================================="

echo "=== Lines 1157-1165 msm_vidc_probe.c (DOCKER) ==="
sed -n '1157,1165p' driver/vidc/src/msm_vidc_probe.c || echo "File not found"
echo "=================================================="

echo "Starting build for ${MACHINE}"
echo "Using kas file: ${KAS_FILE}"
echo "Running build command: ${BUILD_COMMAND}"
which kas
kas --version

# ------------------------------------------------------------------ #
#  Step 1: kas checkout — sets up all layers and writes local.conf   #
# ------------------------------------------------------------------ #
echo "=== Step 1: kas checkout ==="
kas checkout "${KAS_FILE}"

LOCAL_CONF="/workspace/video-driver/build/conf/local.conf"
if [ ! -f "${LOCAL_CONF}" ]; then
  echo "❌ local.conf not found after kas checkout: ${LOCAL_CONF}"
  exit 1
fi
echo "✅ local.conf found: ${LOCAL_CONF}"

# ------------------------------------------------------------------ #
#  Step 2: Append EXTERNALSRC overrides to local.conf                #
#  This happens AFTER kas checkout so kas cannot overwrite it        #
# ------------------------------------------------------------------ #
echo "=== Step 2: Appending KAS_LOCAL_CONF_HEADER to local.conf ==="
printf '\n%s\n' "${KAS_LOCAL_CONF_HEADER}" >> "${LOCAL_CONF}"
echo "✅ Appended successfully"

echo "=== local.conf EXTERNALSRC lines ==="
grep -n "EXTERNALSRC\|iris-video-dlkm\|do_fetch\|do_patch\|BB_NUMBER" \
  "${LOCAL_CONF}" || echo "❌ NO EXTERNALSRC FOUND!"
echo "====================================="

if ! grep -q "EXTERNALSRC:pn-iris-video-dlkm" "${LOCAL_CONF}"; then
  echo "❌ EXTERNALSRC override missing from local.conf!"
  exit 1
fi
echo "✅ EXTERNALSRC confirmed in local.conf"

# ------------------------------------------------------------------ #
#  Step 3: Run bitbake inside kas shell                              #
#  kas shell sets up the full OE environment (BBPATH, PATH etc)     #
#  We pass --no-checkout to prevent kas from overwriting local.conf  #
# ------------------------------------------------------------------ #
echo "=== Step 3: Running bitbake via kas shell --no-checkout ==="
kas shell --no-checkout -c "${BUILD_COMMAND}" "${KAS_FILE}"

echo "✅ Build completed successfully"
"""

workspace_root = os.environ.get('WORKSPACE_ROOT', '')
build_script = os.path.join(workspace_root, 'ci_build.sh')
with open(build_script, 'w') as f:
    f.write(script)
os.chmod(build_script, 0o755)
print(f"✅ Build script written to: {build_script}")
PYEOF

        echo "=== Build script written ==="
        head -20 "${BUILD_SCRIPT}"
        echo "==========================="

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          "${{ inputs.docker_image }}" \
          bash -l /workspace/ci_build.sh

        # Cleanup temp files
        rm -f "${BUILD_SCRIPT}" "${KAS_CONF_FILE}" || true