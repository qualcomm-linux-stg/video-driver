name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Build ${{ env.machine }}
      shell: python3 {0}
      run: |
        import os
        import subprocess
        import sys

        machine      = os.environ.get("machine", "")
        kas_file     = "${{ inputs.kas_file }}"
        build_cmd    = "${{ inputs.build_command }}"
        docker_image = "${{ inputs.docker_image }}"
        workspace    = os.getcwd()
        workspace_root = os.path.dirname(workspace)
        repo_name    = os.path.basename(workspace)

        print(f"Machine       : {machine}")
        print(f"Docker image  : {docker_image}")
        print(f"KAS file      : {kas_file}")
        print(f"Build command : {build_cmd}")
        print(f"WORKSPACE_ROOT: {workspace_root}")
        print(f"REPO_NAME     : {repo_name}")

        # ------------------------------------------------------------------ #
        #  Step 1: Write KAS_LOCAL_CONF_HEADER to a file.                    #
        #  Multiline env vars are silently truncated by docker run -e.       #
        # ------------------------------------------------------------------ #
        kas_conf_content = os.environ.get("KAS_LOCAL_CONF_HEADER", "")
        kas_conf_file    = os.path.join(workspace_root, "kas_local_conf_header.txt")

        with open(kas_conf_file, "w") as f:
            f.write(kas_conf_content)

        print("=== KAS_LOCAL_CONF_HEADER written to HOST file ===")
        print(kas_conf_content)
        print("===================================================")

        if not kas_conf_content.strip():
            print("❌ KAS_LOCAL_CONF_HEADER is EMPTY!")
            sys.exit(1)

        # ------------------------------------------------------------------ #
        #  Step 2: Write the full build script using Python — NO heredoc.    #
        #  Script flow inside Docker:                                        #
        #    1. Load KAS_LOCAL_CONF_HEADER from file                         #
        #    2. kas checkout  → sets up layers + writes local.conf           #
        #    3. Append header → injects EXTERNALSRC into local.conf          #
        #    4. kas shell -c  → OE env setup + bitbake                       #
        # ------------------------------------------------------------------ #
        build_script_path = os.path.join(workspace_root, "ci_build.sh")

        build_script = r"""#!/bin/bash
set -euo pipefail

# Load KAS_LOCAL_CONF_HEADER from mounted file
KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"
if [ -f "${KAS_CONF_FILE}" ] && [ -s "${KAS_CONF_FILE}" ]; then
  export KAS_LOCAL_CONF_HEADER="$(cat "${KAS_CONF_FILE}")"
  echo "✅ KAS_LOCAL_CONF_HEADER loaded from file"
else
  echo "❌ KAS_LOCAL_CONF_HEADER file missing or empty!"
  exit 1
fi

echo "=== inside container ==="
echo "pwd: $(pwd)"
echo "=== KAS_LOCAL_CONF_HEADER (first 5 lines) ==="
echo "${KAS_LOCAL_CONF_HEADER}" | head -5
echo "=============================================="

echo "=== Lines 1157-1165 msm_vidc_probe.c ==="
sed -n '1157,1165p' driver/vidc/src/msm_vidc_probe.c || echo "File not found"
echo "========================================="

echo "Starting build for ${MACHINE}"
echo "KAS file: ${KAS_FILE}"
echo "Build command: ${BUILD_COMMAND}"
which kas
kas --version

# Step 1: kas checkout — sets up layers and writes local.conf
echo "=== Step 1: kas checkout ==="
kas checkout "${KAS_FILE}"

# Step 2: Verify local.conf exists
LOCAL_CONF="/workspace/video-driver/build/conf/local.conf"
if [ ! -f "${LOCAL_CONF}" ]; then
  echo "❌ local.conf not found at: ${LOCAL_CONF}"
  exit 1
fi
echo "✅ local.conf found: ${LOCAL_CONF}"

# Step 3: Append EXTERNALSRC override to local.conf
echo "=== Step 2: Appending KAS_LOCAL_CONF_HEADER to local.conf ==="
printf '\n%s\n' "${KAS_LOCAL_CONF_HEADER}" >> "${LOCAL_CONF}"
echo "✅ Appended successfully"

# Verify it was written
echo "=== local.conf EXTERNALSRC lines ==="
grep -n "EXTERNALSRC\|iris-video-dlkm\|do_fetch\|do_patch" "${LOCAL_CONF}" \
  || echo "❌ NO EXTERNALSRC FOUND!"
echo "====================================="

if ! grep -q "EXTERNALSRC:pn-iris-video-dlkm" "${LOCAL_CONF}"; then
  echo "❌ EXTERNALSRC override missing from local.conf!"
  exit 1
fi
echo "✅ EXTERNALSRC confirmed in local.conf"

# Step 4: kas shell to set up OE environment and run bitbake
# kas shell -c runs bitbake INSIDE the kas-managed OE environment
# local.conf is already patched so EXTERNALSRC applies
echo "=== Step 3: Running bitbake via kas shell ==="
kas shell -c "${BUILD_COMMAND}" "${KAS_FILE}"
"""

        with open(build_script_path, "w") as f:
            f.write(build_script)

        os.chmod(build_script_path, 0o755)
        print(f"✅ Build script written to: {build_script_path}")

        # ------------------------------------------------------------------ #
        #  Step 3: Run Docker with the build script mounted and executed.    #
        # ------------------------------------------------------------------ #
        import pwd
        uid = os.getuid()
        gid = os.getgid()

        cmd = [
            "docker", "run", "--rm",
            "--user", f"{uid}:{gid}",
            "-v", f"{workspace_root}:/workspace",
            "-w", f"/workspace/{repo_name}",
            "-e", f"MACHINE={machine}",
            "-e", f"KAS_FILE={kas_file}",
            "-e", f"BUILD_COMMAND={build_cmd}",
            docker_image,
            "bash", "-l", "/workspace/ci_build.sh"
        ]

        print(f"=== Running Docker command ===")
        print(" ".join(cmd))
        print("==============================")

        result = subprocess.run(cmd)
        sys.exit(result.returncode)