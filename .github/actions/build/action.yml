name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Write KAS conf and build script
      shell: bash
      run: |
        set -euo pipefail

        WORKSPACE_ROOT="$(dirname "${PWD}")"
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"

        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "${KAS_CONF_FILE}"

        echo "=== KAS_LOCAL_CONF_HEADER on HOST ==="
        cat "${KAS_CONF_FILE}"
        echo "====================================="

        if [ ! -s "${KAS_CONF_FILE}" ]; then
          echo "❌ KAS_LOCAL_CONF_HEADER is EMPTY!"
          exit 1
        fi

        BUILD_SCRIPT="${WORKSPACE_ROOT}/ci_build.sh"
        rm -f "${BUILD_SCRIPT}"

        printf '%s\n' '#!/bin/bash'                                                           >> "${BUILD_SCRIPT}"
        printf '%s\n' 'set -euo pipefail'                                                     >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'KAS_CONF_FILE="/workspace/kas_local_conf_header.txt"'                  >> "${BUILD_SCRIPT}"
        printf '%s\n' 'if [ -f "${KAS_CONF_FILE}" ] && [ -s "${KAS_CONF_FILE}" ]; then'       >> "${BUILD_SCRIPT}"
        printf '%s\n' '  export KAS_LOCAL_CONF_HEADER="$(cat "${KAS_CONF_FILE}")"'            >> "${BUILD_SCRIPT}"
        printf '%s\n' '  echo "✅ KAS_LOCAL_CONF_HEADER loaded from file"'                    >> "${BUILD_SCRIPT}"
        printf '%s\n' 'else'                                                                   >> "${BUILD_SCRIPT}"
        printf '%s\n' '  echo "❌ KAS_LOCAL_CONF_HEADER file missing or empty!"'              >> "${BUILD_SCRIPT}"
        printf '%s\n' '  exit 1'                                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' 'fi'                                                                     >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== inside container ==="'                                        >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "pwd: $(pwd)"'                                                     >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== KAS_LOCAL_CONF_HEADER first 3 lines ==="'                    >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "${KAS_LOCAL_CONF_HEADER}" | head -3'                             >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== Step 1: kas checkout ==="'                                   >> "${BUILD_SCRIPT}"
        printf '%s\n' 'kas checkout "${KAS_FILE}"'                                            >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'LOCAL_CONF="/workspace/video-driver/build/conf/local.conf"'            >> "${BUILD_SCRIPT}"
        printf '%s\n' 'if [ ! -f "${LOCAL_CONF}" ]; then'                                    >> "${BUILD_SCRIPT}"
        printf '%s\n' '  echo "❌ local.conf not found: ${LOCAL_CONF}"'                       >> "${BUILD_SCRIPT}"
        printf '%s\n' '  exit 1'                                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' 'fi'                                                                     >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== Step 2: Appending EXTERNALSRC to local.conf ==="'           >> "${BUILD_SCRIPT}"
        printf '%s\n' 'printf "\n%s\n" "${KAS_LOCAL_CONF_HEADER}" >> "${LOCAL_CONF}"'        >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "✅ Appended to local.conf"'                                      >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== EXTERNALSRC lines in local.conf ==="'                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'grep -n "EXTERNALSRC\|do_fetch\|do_patch" "${LOCAL_CONF}" || echo "❌ NOT FOUND"' >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== Step 3: Running bitbake via kas shell ==="'                 >> "${BUILD_SCRIPT}"
        printf '%s\n' 'kas shell "${KAS_FILE}" -c "${BUILD_COMMAND}"'                        >> "${BUILD_SCRIPT}"

        chmod +x "${BUILD_SCRIPT}"

        echo "=== ci_build.sh written ==="
        cat "${BUILD_SCRIPT}"
        echo "============================="

    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          "${{ inputs.docker_image }}" \
          bash -lc "/workspace/ci_build.sh"