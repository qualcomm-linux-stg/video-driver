name: Build
description: Build the project using a Docker container

inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake core-image-base"

runs:
  using: "composite"
  steps:
    - name: Write KAS overlay and build script
      shell: bash
      run: |
        set -euo pipefail

        WORKSPACE_ROOT="$(dirname "${PWD}")"
        KAS_CONF_FILE="${WORKSPACE_ROOT}/kas_local_conf_header.txt"

        printf '%s' "${KAS_LOCAL_CONF_HEADER:-}" > "${KAS_CONF_FILE}"

        echo "=== KAS_LOCAL_CONF_HEADER on HOST ==="
        cat "${KAS_CONF_FILE}"
        echo "====================================="

        if [ ! -s "${KAS_CONF_FILE}" ]; then
          echo "❌ KAS_LOCAL_CONF_HEADER is EMPTY!"
          exit 1
        fi

        # ------------------------------------------------------------------ #
        #  Write a KAS overlay YAML with local_conf_header.                  #
        #  kas processes local_conf_header natively and writes it to         #
        #  local.conf DURING kas shell init — it cannot be wiped.            #
        #  This is the only reliable way to inject EXTERNALSRC into kas.     #
        # ------------------------------------------------------------------ #
        KAS_OVERLAY="${WORKSPACE_ROOT}/ci_externalsrc_overlay.yml"

        # Write header of overlay YAML
        printf '%s\n' 'header:'                               > "${KAS_OVERLAY}"
        printf '%s\n' '  version: 14'                        >> "${KAS_OVERLAY}"
        printf '%s\n' ''                                      >> "${KAS_OVERLAY}"
        printf '%s\n' 'local_conf_header:'                   >> "${KAS_OVERLAY}"
        printf '%s\n' '  iris-video-ci-override: |'          >> "${KAS_OVERLAY}"

        # Append each line of KAS_LOCAL_CONF_HEADER indented with 4 spaces
        while IFS= read -r line; do
          printf '    %s\n' "${line}"                         >> "${KAS_OVERLAY}"
        done < "${KAS_CONF_FILE}"

        echo "=== KAS overlay YAML written ==="
        cat "${KAS_OVERLAY}"
        echo "================================="

        # ------------------------------------------------------------------ #
        #  Write ci_build.sh using printf line by line — no heredoc.         #
        # ------------------------------------------------------------------ #
        BUILD_SCRIPT="${WORKSPACE_ROOT}/ci_build.sh"
        rm -f "${BUILD_SCRIPT}"

        printf '%s\n' '#!/bin/bash'                                                                     >> "${BUILD_SCRIPT}"
        printf '%s\n' 'set -euo pipefail'                                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== inside container ==="'                                                  >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "pwd: $(pwd)"'                                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== /workspace ==="'                                                        >> "${BUILD_SCRIPT}"
        printf '%s\n' 'ls -la /workspace'                                                                >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' '# ✅ Verify KAS overlay exists'                                                   >> "${BUILD_SCRIPT}"
        printf '%s\n' 'KAS_OVERLAY="/workspace/ci_externalsrc_overlay.yml"'                             >> "${BUILD_SCRIPT}"
        printf '%s\n' 'if [ ! -f "${KAS_OVERLAY}" ]; then'                                              >> "${BUILD_SCRIPT}"
        printf '%s\n' '  echo "❌ KAS overlay not found: ${KAS_OVERLAY}"'                               >> "${BUILD_SCRIPT}"
        printf '%s\n' '  exit 1'                                                                         >> "${BUILD_SCRIPT}"
        printf '%s\n' 'fi'                                                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== KAS overlay contents ==="'                                              >> "${BUILD_SCRIPT}"
        printf '%s\n' 'cat "${KAS_OVERLAY}"'                                                             >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "============================="'                                             >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' '# ✅ Combine kas file with overlay'                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' 'FULL_KAS_FILE="${KAS_FILE}:${KAS_OVERLAY}"'                                      >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== Full KAS file: ${FULL_KAS_FILE} ==="'                                  >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' '# ✅ Verify PR file is present'                                                   >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "=== Lines 1157-1165 msm_vidc_probe.c ==="'                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' 'sed -n "1157,1165p" driver/vidc/src/msm_vidc_probe.c || echo "File not found"'  >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "======================================"'                                    >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "Starting build for ${MACHINE}"'                                            >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "KAS file: ${FULL_KAS_FILE}"'                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' 'echo "Build command: ${BUILD_COMMAND}"'                                          >> "${BUILD_SCRIPT}"
        printf '%s\n' 'which kas && kas --version'                                                       >> "${BUILD_SCRIPT}"
        printf '%s\n' ''                                                                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' '# ✅ kas shell with overlay — kas writes local_conf_header to local.conf'        >> "${BUILD_SCRIPT}"
        printf '%s\n' '# during init, BEFORE bitbake runs — cannot be wiped'                            >> "${BUILD_SCRIPT}"
        printf '%s\n' 'kas shell "${FULL_KAS_FILE}" -c "'                                               >> "${BUILD_SCRIPT}"
        printf '%s\n' '  echo \"=== local.conf EXTERNALSRC lines ===\"'                                 >> "${BUILD_SCRIPT}"
        printf '%s\n' '  grep -n \"EXTERNALSRC\|do_fetch\|do_patch\" build/conf/local.conf || echo \"❌ NOT FOUND\"' >> "${BUILD_SCRIPT}"
        printf '%s\n' '  echo \"=====================================\"'                                >> "${BUILD_SCRIPT}"
        printf '%s\n' '  ${BUILD_COMMAND}'                                                              >> "${BUILD_SCRIPT}"
        printf '%s\n' '"'                                                                                >> "${BUILD_SCRIPT}"

        chmod +x "${BUILD_SCRIPT}"

        echo "=== ci_build.sh written ==="
        cat "${BUILD_SCRIPT}"
        echo "==========================="

    - name: Build ${{ env.machine }}
      shell: bash
      run: |
        set -euo pipefail

        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ env.machine }}"
        KAS_FILE="${{ inputs.kas_file }}"
        BUILD_COMMAND="${{ inputs.build_command }}"
        WORKSPACE_ROOT="$(dirname "${PWD}")"
        REPO_NAME="$(basename "${PWD}")"

        echo "Machine: ${MACHINE}"
        echo "Docker image: ${{ inputs.docker_image }}"
        echo "KAS file: ${KAS_FILE}"
        echo "Build command: ${BUILD_COMMAND}"
        echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT}"
        echo "REPO_NAME: ${REPO_NAME}"

        docker run --rm \
          --user "${USER_ID}:${GROUP_ID}" \
          -v "${WORKSPACE_ROOT}:/workspace" \
          -w "/workspace/${REPO_NAME}" \
          -e "MACHINE=${MACHINE}" \
          -e "KAS_FILE=${KAS_FILE}" \
          -e "BUILD_COMMAND=${BUILD_COMMAND}" \
          "${{ inputs.docker_image }}" \
          bash -lc "/workspace/ci_build.sh"